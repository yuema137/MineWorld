# A decision model is a pure function of what it is given (DECISIONS.md ARC-27 note of 2026-10-13,
# MODULE_SPEC.md §5.1): `&self`, and no state hidden behind it. Clippy reads the nearest clippy.toml, so
# this file repeats the workspace's entries and adds every interior-mutability type. Every model crate
# carries a copy (pr-dl-a-decision-list.md R-S24-8).
disallowed-types = [
    { path = "std::collections::HashMap", reason = "use BTreeMap: iteration order reaches serialized state and must be deterministic" },

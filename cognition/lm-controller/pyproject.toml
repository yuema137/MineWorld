# mineworld-cognition: the language-model side of a cognition client (S10).
#
# Design: .structured-coding/plans/mvp0/pr-s10-p5-backends.md (P5a). Dependencies are recorded in
# docs/DECISIONS.md (DEP-24 Pydantic, DEP-27 httpx2 and no provider SDK, DEP-32 python-dotenv, DEP-26 the
# toolchain); adding one is a decision, not an edit.

[project]
name = "mineworld-cognition"
version = "0.1.0"
description = "Ask a language model through one provider-neutral interface, with budgets and recorded replay."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # EntityKey (a seat's key) and JsonValue; one way: mineworld-sdk never imports this package (I-2).
    "mineworld-sdk",
    "pydantic>=2.13,<3",
    # The HTTP client of the one OpenAI-compatible adapter, imported by backend/openai_compatible.py only
    # (DEP-27, D-P5-4 (e)).
    "httpx2>=2.13,<3",
    # dotenv_values only, never load_dotenv; imported by secrets.py only (DEP-32, D-P5-9).
    "python-dotenv>=1.2,<2",
]

# Retention policies (pr-fg-b §5.3): the bundled ones are found through this group exactly as a user's
# package would publish one; the entry name is the policy's id. Standard metadata, no dependency.
[project.entry-points."mineworld.forgetting"]
consolidate = "mineworld_cognition.forgetting.consolidate:Consolidate"
decay = "mineworld_cognition.forgetting.decay:Decay"
importance-recency-cap = "mineworld_cognition.forgetting.importance_recency_cap:ImportanceRecencyCap"
keep-all = "mineworld_cognition.forgetting.keep_all:KeepAll"
# The assisted policy (pr-fg-c): the same group, found the same way; it asks a model only through the host's
# summary gateway, and names `consolidate` as its no-model fallback.
lm-summarise = "mineworld_cognition.forgetting.lm_summarise:LmSummarise"

# Retry policies of the LM controller's transport, content and semantic layers (pr-s10-p6 §5.5.2). The entry
# name is the policy's id, as for the forgetting policies above. Standard metadata, no dependency.
[project.entry-points."mineworld.retry"]
exponential-backoff = "mineworld_cognition.controller.retry:ExponentialBackoff"
fixed = "mineworld_cognition.controller.retry:Fixed"
none = "mineworld_cognition.controller.retry:NoRetry"

# The per-seat circuit breakers (pr-s10-p6 §5.6). Same conventions as the retry group above.
[project.entry-points."mineworld.breaker"]
failure-rate = "mineworld_cognition.controller.breaker:FailureRate"
never = "mineworld_cognition.controller.breaker:Never"

# The memory scopes (pr-s28c §5.4). `person` and `world` are the base scopes: only this distribution may
# publish them (ScopeRegistry's load check, QS28c-1).
[project.entry-points."mineworld.memory_scopes"]
person = "mineworld_cognition.memory.scopes.person:PersonScope"
world = "mineworld_cognition.memory.scopes.world:WorldScope"

[tool.uv.sources]
mineworld-sdk = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-socket>=0.8,<0.9",
    "ruff>=0.16",
    "pyright[nodejs]>=1.1.414",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# The SDK's rule set (sdk/python/pyproject.toml): pycodestyle, pyflakes, import order, pyupgrade,
# bugbear, annotations, ruff's own.
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `live_model` marks a test that calls a real model server on a loopback address named by
# MINEWORLD_LIVE_BASE_URL (D-P5-12). It is deselected here, for every run; an operator selects it with
# `-m live_model`. A selected live test without the variable fails; it never skips itself.
# `real_binary` marks a test that runs the real `mineworld` binary (the AC-10 scenario, pr-s10-p4 §5.10).
# It fails, never skips, without the binary; `python-smoke`, which builds none, deselects it by name.
markers = [
    "live_model: calls a real model server on loopback; deselected by default, never in CI",
    "real_binary: runs the real mineworld binary; never skipped, only deselected by name",
    "slow: a heavy case of a harness whose reduced set runs per PR; the nightly `stability` layer runs these (pr-s28a D-a-15)",
]
# The network guard (I-11, as sdk/python): pytest-socket blocks every `connect` to anything but the
# loopback addresses, on every platform. It allows loopback, where a user's Ollama listens, which is why
# replay mode also constructs no network client (D-P5-5, AP5-6).
# `-v` names every test in CI's log, so a platform-specific case (the bridge's Windows `.cmd` shim,
# pr-s10-p5b AB-9) is shown to have run, by name, on the leg that owns it.
# `slow` cases (pr-s28a D-a-15, primary ruling 2026-10-16) are deselected here, for every PR run, and run each
# night by the `stability` layer (`scripts/ci_layer.py`), whose `-m slow` replaces this expression.
addopts = ["--strict-markers", "--allow-hosts=127.0.0.1,::1", "-v", "-m", "not live_model and not slow"]

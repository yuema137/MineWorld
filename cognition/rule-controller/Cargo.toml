[package]
name = "mineworld-rule-controller"
description = "A deterministic controller: decides what a Person attempts from the observation it is given, with no model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# A controller is written against the System Packs of the world it plays in: it may use the actions
# those packs provide and cannot invent one (`MODULE_SPEC.md` §5). It depends on no transport, no
# server and no kernel — an observation in, a request out, and nothing else reachable from here.
mineworld-contracts = { workspace = true }
# The decision-model trait this controller implements as `rule`, and the seeded `Draw` it takes every
# choice from (pr-dl-a-decision-list.md SD-DLa-2).
mineworld-decision = { workspace = true }
mineworld-conversation = { workspace = true }
# For `move` and the doorways a place discloses: the paced controller walks (step-08 C3).
mineworld-movement = { workspace = true }
# For invite / accept / decline / join / leave and the invitations and participation a person is
# disclosed: the paced controller does things together (step-09 C5).
mineworld-group-activity = { workspace = true }
# For the display name a person is disclosed with: a reply names the other speaker by it (ARC-31).
mineworld-naming = { workspace = true }
# For the Agenda a person is disclosed: the paced controller walks where its day says (ARC-32).
mineworld-schedule = { workspace = true }
mineworld-packages = { workspace = true }
# The parameter block's JSON Schema, for the generated reference (ARC-90): the commute policy (ARC-282).
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

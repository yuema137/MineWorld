[package]
name = "mineworld-sdk"
description = "What a Rust System Pack declares about itself — the SystemPack trait — and the macro a build's installed set of System Packs is written in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Below every System Pack, beside the kernel: a pack implements this crate's trait, and the installed
# set (systems/installed) expands this crate's macro. It names no pack and no perception trait, so any
# pack — presence included — can implement it without a cycle (DECISIONS.md ARC-33).
mineworld-authoring = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# A pack's package identity — Package and package!(), re-exported (DECISIONS.md ARC-53). A leaf: it
# names no MineWorld crate, so the SDK still depends on no pack.
mineworld-packages = { workspace = true }
# A pack's schemas, for the generated reference (DECISIONS.md ARC-90, DEP-49): the SystemPack questions,
# parameters!'s impls and an Interaction List section's schema, built as JSON values.
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# A pack that does not state its PACKAGE does not compile; tests/compile_fail.rs shows it.
trybuild = { workspace = true }

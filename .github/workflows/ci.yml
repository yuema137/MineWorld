# MineWorld CI: layers 1 and 2 of ENGINEERING_STANDARDS.md §16, and the runtime image's evidence.
#
# Triggers, what blocks, and why are docs/DECISIONS.md ARC-48; the service and images are DEP-17 and
# DEP-18. Jobs name layers; the commands of a layer live in scripts/ci_layer.py only. The job names
# `fast` and `test` are an interface: a required check matches them by name.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history as a partial clone; the 3D client and presentation trees are not needed by any
      # check (step-14 §3.5). A shallow clone would make the AC-1 scan fail by name (ARC-35).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/clients/3d-spike/
            !/presentation/
      - uses: ./.github/actions/layer
        with:
          layer: fast

  test:
    name: test
    # Non-draft PRs, main, and scratch branches pushed to show a mutation turning CI red (step-14
    # §9.0 R-4). A `-image` scratch branch exists for the image job only.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image'))
    runs-on: ubuntu-24.04
    # A cold build plus the full suite on a 2-vCPU private runner exceeded 45 min (step-14 A-C3, run 1).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/clients/3d-spike/
            !/presentation/
      - uses: ./.github/actions/layer
        with:
          layer: core
          free-disk: "true"

  # Not a layer: evidence that the shipped image hosts a world (step-14 A13-5). On demand, or from a
  # scratch branch named `scratch/*-image` before this workflow is on main (dispatch needs it there).
  image:
    name: image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       endsWith(github.ref, '-image'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: mineworld:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Run the image as an operator would
        run: python3 scripts/ci_image.py mineworld:ci

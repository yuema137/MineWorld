# SCRATCH (fix/p6b-rejoin-flake): repeats test (b) of the handback/rejoin on windows-2025. Never merged.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    name: repeat (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [fixed, fixed2]
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - run: rustup toolchain install
      - run: cargo build -p mineworld-cli
      - if: matrix.check == 'before'
        name: Restore the pre-fix test
        shell: bash
        run: git show 83e011fe:cognition/lm-controller/tests/test_controller_server.py > cognition/lm-controller/tests/test_controller_server.py && git diff --stat
      - name: Run test (b) 20 times
        shell: bash
        run: |
          pass=0; fail=0
          for i in $(seq 1 25); do
            if PYTHONPATH=cognition/lm-controller/tests timeout -k 10 300 uv run --locked pytest -p scratch_watchdog "cognition/lm-controller/tests/test_controller_server.py::test_b_a_failing_script_hands_the_seat_back_and_the_runner_rejoins" -p no:cacheprovider -q -s > run.txt 2>&1; then
              pass=$((pass+1)); echo "run $i PASS $(grep -E 'passed|failed' run.txt | tail -1)"
            else
              fail=$((fail+1)); echo "run $i FAIL"; cat run.txt
            fi
          done
          echo "SUMMARY ${{ matrix.check }}: pass=$pass fail=$fail"
          [ "$fail" -eq 0 ]

# MineWorld CI: layers 1 and 2 of ENGINEERING_STANDARDS.md §16, and the runtime image's evidence.
#
# Triggers, what blocks, and why are docs/DECISIONS.md ARC-48; the service and images are DEP-17 and
# DEP-18. Jobs name layers; the commands of a layer live in scripts/ci_layer.py only. The job names
# `fast` and `test` are an interface: a required check matches them by name.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fast:
    name: fast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Full history as a partial clone: every commit and tree, and only the checked-out revision's
      # blobs. A shallow clone would make the AC-1 scan fail by name (ARC-35). The whole tree is
      # checked out, because tests read presentation/ and clients/protocol/ (step-14 A-C3, run 2).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/layer
        with:
          layer: fast

  test:
    name: test
    # Non-draft PRs, main, and scratch branches pushed to show a mutation turning CI red (step-14
    # §9.0 R-4). A `-image` scratch branch exists for the image job only.
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/layer
        with:
          layer: core

  # S16's packages on macOS and Windows, natively (step-16 §16.12 PD-p1, §17.12 PD-q4): the `platforms`
  # layer, with `test`'s triggers. Linux keeps its container layers. The whole checkout: its longest path
  # is 120 characters, far inside Windows' MAX_PATH; Git's default core.autocrlf is left as the runner
  # has it, so the layer reads CRLF files as a Windows user would. Whether it blocks a merge is ARC-48's
  # question, raised to S13.
  platforms:
    name: platforms (${{ matrix.os }})
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/native
        with:
          layer: platforms

  # The Python workspace (sdk/python): ci_layer.py's `python` layer (static checks, the binary, pytest
  # with the real server) or `python-smoke` (no binary; the real_server tests deselected by name). Its
  # own job, so the required `fast` and `test` are neither renamed nor slowed (pr-s10-p3 QP3-3); not a
  # required check until the primary session makes it one. Every platform (D-P3-11): Linux runs in the
  # toolchain container like every other layer; Windows and macOS cannot, so they install the pinned
  # Rust toolchain (rust-toolchain.toml) and uv (DEP-26) on the runner, and Python from uv, at the
  # floor `requires-python` declares (ARC-48's note of 2026-10-08).
  python:
    name: python (${{ matrix.os }}, ${{ matrix.layer }})
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, layer: python }
          - { os: windows-2025, layer: python }
          - { os: macos-15, layer: python }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - if: runner.os == 'Linux'
        uses: ./.github/actions/layer
        with:
          layer: ${{ matrix.layer }}
      - if: runner.os != 'Linux'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - if: runner.os != 'Linux' && matrix.layer == 'python'
        name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - if: runner.os != 'Linux'
        name: Run layer ${{ matrix.layer }}
        run: uv run --locked python scripts/ci_layer.py ${{ matrix.layer }}

  # Not a layer: evidence that the shipped image hosts a world (step-14 A13-5). On demand, or from a
  # scratch branch named `scratch/*-image` before this workflow is on main (dispatch needs it there).
  image:
    name: image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       endsWith(github.ref, '-image'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: mineworld:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Run the image as an operator would
        run: python3 scripts/ci_image.py mineworld:ci

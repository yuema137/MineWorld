# MineWorld CI: layers 1–3 of ENGINEERING_STANDARDS.md §16, AC-8's parity across macOS, Linux and
# Windows, and the default suite on Windows and macOS.
#
# Triggers, what blocks, and why are docs/DECISIONS.md ARC-48 (and its 2026-10-09 note); the service
# and images are DEP-17 and DEP-18; AC-8's measurement and runners are ARC-49 and DEP-19. Jobs name layers; the commands of a layer live in scripts/ci_layer.py only. The job names
# `fast` and `test` are an interface: a required check matches them by name.
#
# A documentation-only change does not run the build (ARC-48's note of 2026-10-09 for 13x, step-14 §16):
# `changes` classifies the diff with scripts/ci_changes.py; with `code == 'false'`, `fast` runs only the
# `docs` layer and every other job is skipped by its job-level `if:`, which a required check reads as
# passing. There is deliberately no workflow-level `paths-ignore`: a workflow that never starts leaves
# the required checks pending forever.
name: CI

on:
  # Feature branches run from `pull_request` only, so a PR commit runs once; `scratch/**` carries
  # mutation runs (step-14 §9.0 R-4).
  push:
    branches: [main, "scratch/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Code or documentation only? scripts/ci_changes.py decides, failing closed (a push to main, a
  # dispatch, a new branch, a force-push, an empty diff or any git failure are code). Every other job
  # needs it.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: classify
        name: Classify the change set
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: >-
          python3 scripts/ci_changes.py --event "$EVENT" --ref "$REF" --base "$BASE" --head "$HEAD"
          --github-output "$GITHUB_OUTPUT"

  fast:
    name: fast
    needs: changes
    # Always, so that a failed `changes` turns this required check red instead of skipping everything.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a classified change set
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.code != 'true' && needs.changes.outputs.code != 'false')
        env:
          RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes: result '$RESULT', code '$CODE': nothing is known about this change, so nothing passes"
          exit 1
      # Full history as a partial clone: every commit and tree, and only the checked-out revision's
      # blobs. A shallow clone would make the AC-1 scan fail by name (ARC-35). The whole tree is
      # checked out, because tests read presentation/ and clients/protocol/ (step-14 A-C3, run 2).
      - if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/layer
        with:
          layer: fast
      # Documentation only: the doc checks on the runner's Python, no toolchain and no container.
      - if: needs.changes.outputs.code == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: needs.changes.outputs.code == 'false'
        name: Run layer docs
        run: python3 scripts/ci_layer.py docs

  test:
    name: test
    # Non-draft PRs, main, and scratch branches pushed to show a mutation turning CI red (step-14
    # §9.0 R-4). A `-image` scratch branch exists for the image job only; a `-nightly` one for
    # nightly.yml (ARC-83), which runs its own samples of this suite.
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image') && !endsWith(github.ref, '-scenario') &&
       !endsWith(github.ref, '-nightly')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/layer
        with:
          layer: core

  # The whole default suite on Windows and on macOS, natively: the same `core` commands as `test`, with
  # `test`'s triggers and dispatch (step-14 §15.5). They report and are not required checks; whether they
  # become required is the operator's (QB-11, ARC-48's note of 2026-10-09 for 13w). The whole checkout:
  # its longest path is 120 characters, far inside Windows' MAX_PATH. .gitattributes checks text out with
  # LF on every platform (step-14 W-3). Runner labels are pinned, never `-latest`, as AC-8's are (DEP-19,
  # step-14 §13.0.3).
  test-windows:
    name: test-windows
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image') && !endsWith(github.ref, '-scenario') &&
       !endsWith(github.ref, '-nightly')))
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/native
        with:
          layer: core

  test-macos:
    name: test-macos
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image') && !endsWith(github.ref, '-scenario') &&
       !endsWith(github.ref, '-nightly')))
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/native
        with:
          layer: core

  # S16's packages on macOS and Windows, natively (step-16 §16.12 PD-p1, §17.12 PD-q4): the `platforms`
  # layer, with `test`'s triggers. Kept beside `test-windows` and `test-macos` (step-14 §15, D-13w-6):
  # besides tests that `core` also runs, the layer runs E-c's offline vendor check (PD-p3, EC-3 (b)), which
  # `core` does not. CRLF input is covered by tests that write CRLF themselves (ED-13, IB-10), so the
  # action's line-endings report reads 0 by design.
  platforms:
    name: platforms (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image') && !endsWith(github.ref, '-scenario') &&
       !endsWith(github.ref, '-nightly')))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/native
        with:
          layer: platforms

  # The Python workspace (sdk/python): ci_layer.py's `python` layer (static checks, the binary, pytest
  # with the real server) or `python-smoke` (no binary; the real_server tests deselected by name). Its
  # own job, so the required `fast` and `test` are neither renamed nor slowed (pr-s10-p3 QP3-3); not a
  # required check until the primary session makes it one. Every platform (D-P3-11): Linux runs in the
  # toolchain container like every other layer; Windows and macOS cannot, so they install the pinned
  # Rust toolchain (rust-toolchain.toml) and uv (DEP-26) on the runner, and Python from uv, at the
  # floor `requires-python` declares (ARC-48's note of 2026-10-08).
  python:
    name: python (${{ matrix.os }}, ${{ matrix.layer }})
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       !endsWith(github.ref, '-image') && !endsWith(github.ref, '-scenario') &&
       !endsWith(github.ref, '-nightly')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, layer: python }
          - { os: windows-2025, layer: python }
          - { os: macos-15, layer: python }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - if: runner.os == 'Linux'
        uses: ./.github/actions/layer
        with:
          layer: ${{ matrix.layer }}
      - if: runner.os != 'Linux'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - if: runner.os != 'Linux' && matrix.layer == 'python'
        name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - if: runner.os != 'Linux'
        name: Run layer ${{ matrix.layer }}
        run: uv run --locked python scripts/ci_layer.py ${{ matrix.layer }}

  # Layer 3 and AC-8 (docs/DECISIONS.md ARC-49, DEP-19). `scenario`, `linux-arm`, `mac` and `windows`
  # each record what their platform makes of every world on this commit; `ac8` compares the records.
  # They run on pushes to main, on dispatch, and on `scratch/*-scenario` branches (planted-difference
  # evidence); never on pull requests, and none is a required check (ARC-48 note, 2026-10-09). They
  # block main's health: a red `ac8` on main stops the line until fixed or ruled.
  scenario:
    name: scenario
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       endsWith(github.ref, '-scenario')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: mineworld:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      # Evidence that the shipped image hosts a world (step-14 A13-5), for every world.
      - name: Run the image as an operator would
        run: python3 scripts/ci_image.py mineworld:ci
      - name: Record AC-8 in the container (Linux x86_64)
        run: python3 scripts/ci_parity.py record --image mineworld:ci --platform linux/amd64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ac8-linux-x86_64
          path: ac8-linux-x86_64.txt
          if-no-files-found: error

  # The localizer: Linux on arm64 places a difference in the OS or in the architecture.
  linux-arm:
    name: linux-arm
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       endsWith(github.ref, '-scenario')))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          load: true
          tags: mineworld:ci
          cache-from: type=gha,scope=runtime-arm64
          cache-to: type=gha,mode=max,scope=runtime-arm64
      - name: Record AC-8 in the container (Linux arm64)
        run: python3 scripts/ci_parity.py record --image mineworld:ci --platform linux/arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ac8-linux-arm64
          path: ac8-linux-arm64.txt
          if-no-files-found: error

  # The laptop's platform: macOS on Apple Silicon, native. The client trees are not needed to build or
  # run the binary, so they are not checked out.
  mac:
    name: mac
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       endsWith(github.ref, '-scenario')))
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/clients/
            !/presentation/
            /presentation/mineworld-default/*/pack.yaml
            /presentation/mineworld-default/*/manifest.yaml
      - uses: ./.github/actions/native
        with:
          layer: parity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ac8-darwin-arm64
          path: ac8-darwin-arm64.txt
          if-no-files-found: error

  # The operator's third platform: Windows x86_64, native. Text files check out with LF everywhere
  # (.gitattributes), so a world reads the same bytes here as on every other platform.
  windows:
    name: windows
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       endsWith(github.ref, '-scenario')))
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/clients/
            !/presentation/
            /presentation/mineworld-default/*/pack.yaml
            /presentation/mineworld-default/*/manifest.yaml
      - uses: ./.github/actions/native
        with:
          layer: parity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ac8-windows-x86_64
          path: ac8-windows-x86_64.txt
          if-no-files-found: error

  # AC-8's verdict: ci_parity.py's comparison and nothing else. It runs even when a leg failed or was
  # cancelled, so a missing record is a red `ac8`, never a skipped one.
  ac8:
    name: ac8
    needs: [changes, scenario, linux-arm, mac, windows]
    if: >-
      always() && needs.changes.outputs.code == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scratch/') &&
       endsWith(github.ref, '-scenario')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ac8-*
          path: records
          merge-multiple: true
      - name: Compare the platforms' records
        run: python3 scripts/ci_parity.py compare records/*.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ac8-records
          path: records/
          if-no-files-found: warn

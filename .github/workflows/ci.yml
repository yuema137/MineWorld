# SCRATCH (fix/flake-idle): checks the server fix and repeats clients/agent test_idle on windows-2025,
# fixed and with the server fix reverted. Never merged.
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    name: repeat (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [rust, fixed, mutation]
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - run: rustup toolchain install
      - if: matrix.check == 'rust'
        shell: bash
        run: |
          cargo fmt --all --check
          cargo clippy -p mineworld-server -p mineworld-cli --all-targets -- -D warnings
          cargo test -p mineworld-server
      - if: matrix.check == 'mutation'
        name: Revert the server fix (the mutation)
        shell: bash
        run: |
          git checkout e575b149 -- server/src/host.rs server/src/runtime.rs server/src/session.rs server/src/session/join.rs
          git diff --stat HEAD
      - if: matrix.check != 'rust'
        run: cargo build -p mineworld-cli
      - if: matrix.check != 'rust'
        name: Traced idle release, 60 times
        shell: bash
        run: |
          pass=0; fail=0
          for i in $(seq 1 60); do
            if timeout -k 10 120 uv run --locked pytest clients/agent/tests/test_zz_release_diag.py -p no:cacheprovider -q -s > run.txt 2>&1; then
              pass=$((pass+1)); echo "run $i PASS"
            else
              fail=$((fail+1)); echo "run $i FAIL"; grep -E "join refused|seats at clients 0" run.txt | cut -c1-200
            fi
          done
          echo "SUMMARY release ${{ matrix.check }}: pass=$pass fail=$fail"
      - if: matrix.check == 'fixed'
        name: test_idle.py, 15 times
        shell: bash
        run: |
          pass=0; fail=0
          for i in $(seq 1 15); do
            if timeout -k 10 300 uv run --locked pytest clients/agent/tests/test_idle.py -p no:cacheprovider -q -s > run.txt 2>&1; then
              pass=$((pass+1)); echo "run $i PASS $(grep -E 'AC-c-7' run.txt)"
            else
              fail=$((fail+1)); echo "run $i FAIL"; grep -E "AC-c-7|FAILED|^E " run.txt
            fi
          done
          echo "SUMMARY idle-test: pass=$pass fail=$fail"

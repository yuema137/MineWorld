# MineWorld nightly: layer 4 of ENGINEERING_STANDARDS.md §16 — long-running stability, AC-8 at the long
# horizon, the Godot clients, and flake samples — on macOS, Linux and Windows.
#
# docs/DECISIONS.md ARC-83 (this workflow), DEP-45 (Godot), ARC-48's note of 2026-10-10 (what blocks: nothing
# here; no job is a required check, and none runs on a pull request). Jobs name layers of
# scripts/ci_layer.py or subcommands of the nightly scripts, never test commands (I-S13-9).
#
# Verdicts are PASS only on positive evidence (I-13c-3): each job's last step writes
# artifacts/nightly/verdict-<job>.txt with `ci_nightly.py verdict`, and `report` treats a missing one as
# INCONCLUSIVE, which is red. Nothing is retried to green (I-13c-4).
#
# Every value from a branch name, an input or a job output reaches a script through `env:`, never through
# an expression inside `run:`.
name: Nightly

on:
  # 10:17 UTC: off the hour, outside the operator's working day (13c QC-9). The gate skips the night when
  # main has not moved since the last night that ran.
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if main has not moved since the last night
        type: boolean
        default: true
      groups:
        description: "all, or a comma list of: parity-long, stability, clients, repeat"
        type: string
        default: all
  # Pre-merge and mutation evidence: a workflow is dispatchable only once it is on main (F-13c-8).
  # `scratch/<name>[-<group>][-issue]-nightly` runs one group, or all; `-issue` exercises the issue with
  # the label nightly-scratch. ci.yml skips its suites on these branches.
  push:
    branches: ["scratch/**-nightly"]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      groups: ${{ steps.gate.outputs.groups }}
      reason: ${{ steps.gate.outputs.reason }}
      issue: ${{ steps.gate.outputs.issue }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - id: gate
        name: Decide whether tonight runs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          FORCE: ${{ inputs.force }}
          GROUPS: ${{ inputs.groups }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_nightly.py gate --github-output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------------- parity-long
  # AC-8's four legs (ARC-49, DEP-19) with the long profile: 1 000 days in memory and a 300-day save.
  parity-long-linux:
    name: parity-long-linux
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',parity-long,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          load: true
          tags: mineworld:ci
          cache-from: type=gha,scope=runtime
      - id: record
        name: Record the long profile in the container (Linux x86_64)
        run: >-
          python3 scripts/ci_parity.py record --image mineworld:ci --platform linux/amd64 --profile long
          --timings artifacts/nightly/timings-parity-long.json
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
          RECORD: ${{ steps.record.outcome }}
        run: python3 scripts/ci_nightly.py verdict --job parity-long-linux --outcome "$STATUS" --step "record=$RECORD"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-parity-long-linux
          path: artifacts/nightly/
          if-no-files-found: warn

  parity-long-arm:
    name: parity-long-arm
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',parity-long,')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image (linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/arm64
          load: true
          tags: mineworld:ci
          cache-from: type=gha,scope=runtime-arm64
      - id: record
        name: Record the long profile in the container (Linux arm64)
        run: >-
          python3 scripts/ci_parity.py record --image mineworld:ci --platform linux/arm64 --profile long
          --timings artifacts/nightly/timings-parity-long.json
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
          RECORD: ${{ steps.record.outcome }}
        run: python3 scripts/ci_nightly.py verdict --job parity-long-arm --outcome "$STATUS" --step "record=$RECORD"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-parity-long-arm
          path: artifacts/nightly/
          if-no-files-found: warn

  parity-long-mac:
    name: parity-long-mac
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',parity-long,')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/clients/
            !/presentation/
            /presentation/mineworld-default/*/pack.yaml
            /presentation/mineworld-default/*/manifest.yaml
      - uses: ./.github/actions/native
        with:
          layer: parity-long
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: python3 scripts/ci_nightly.py verdict --job parity-long-mac --outcome "$STATUS" --layer parity-long
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-parity-long-mac
          path: artifacts/nightly/
          if-no-files-found: warn

  parity-long-windows:
    name: parity-long-windows
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',parity-long,')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/clients/
            !/presentation/
            /presentation/mineworld-default/*/pack.yaml
            /presentation/mineworld-default/*/manifest.yaml
      - uses: ./.github/actions/native
        with:
          layer: parity-long
      - name: Verdict
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
        run: python scripts/ci_nightly.py verdict --job parity-long-windows --outcome "$STATUS" --layer parity-long
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-parity-long-windows
          path: artifacts/nightly/
          if-no-files-found: warn

  # The comparison (G-1 … G-5, profile long), then the committed baselines (scripts/baselines.txt) on the
  # Linux x86_64 record: two findings, never one hiding the other. A missing leg is FAIL (I-13b-4).
  parity-long:
    name: parity-long
    needs: [gate, parity-long-linux, parity-long-arm, parity-long-mac, parity-long-windows]
    if: >-
      always() && needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',parity-long,')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-parity-long-*
          path: legs
      # `shell: bash` makes it `bash -eo pipefail`, so `tee` cannot hide the script's exit status.
      - id: compare
        name: Compare the platforms' long records
        shell: bash
        run: |
          mkdir -p artifacts/nightly
          python3 scripts/ci_parity.py compare legs/*/parity-long-*.txt 2>&1 | tee artifacts/nightly/compare.txt
      - id: baseline
        name: Check the committed baselines
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/nightly
          python3 scripts/ci_parity.py baseline check legs/nightly-parity-long-linux/parity-long-linux-x86_64.txt \
            2>&1 | tee artifacts/nightly/baseline.txt
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
          COMPARE: ${{ steps.compare.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
        run: >-
          python3 scripts/ci_nightly.py verdict --job parity-long --outcome "$STATUS"
          --step "compare=$COMPARE" --step "baseline=$BASELINE"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-parity-long
          path: artifacts/nightly/
          if-no-files-found: warn

  # ------------------------------------------------------------------------------------ stability
  # The server killed and restarted ten times under a seated SDK client; every world's 300-day save
  # replayed; CA-13. Linux in the toolchain container, macOS and Windows natively with uv (DEP-26).
  stability-linux:
    name: stability-linux
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',stability,')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/layer
        with:
          layer: stability
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: python3 scripts/ci_nightly.py verdict --job stability-linux --outcome "$STATUS" --layer stability
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-stability-linux
          path: artifacts/nightly/
          if-no-files-found: warn

  stability-mac:
    name: stability-mac
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',stability,')
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - uses: ./.github/actions/native
        with:
          layer: stability
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: python3 scripts/ci_nightly.py verdict --job stability-mac --outcome "$STATUS" --layer stability
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-stability-mac
          path: artifacts/nightly/
          if-no-files-found: warn

  stability-windows:
    name: stability-windows
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',stability,')
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.5"
          python-version: "3.12"
          enable-cache: false
      - uses: ./.github/actions/native
        with:
          layer: stability
      - name: Verdict
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
        run: python scripts/ci_nightly.py verdict --job stability-windows --outcome "$STATUS" --layer stability
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-stability-windows
          path: artifacts/nightly/
          if-no-files-found: warn

  # -------------------------------------------------------------------------------------- clients
  # The 25 ignored Godot tests on every OS (DEP-45); on Linux and macOS also the bash launchers' probes,
  # which run if the setup succeeded, even when a Godot test failed. Windows has no clients-probes until
  # a portable launcher exists (S23 R-c; ARC-83).
  clients-linux:
    name: clients-linux
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',clients,')
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/godot
      - id: clients
        uses: ./.github/actions/native
        with:
          layer: clients
      - name: Run layer clients-probes
        if: success() || steps.clients.outcome == 'failure'
        run: python3 scripts/ci_layer.py clients-probes
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: >-
          python3 scripts/ci_nightly.py verdict --job clients-linux --outcome "$STATUS"
          --layer clients --layer clients-probes
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-clients-linux
          path: artifacts/nightly/
          if-no-files-found: warn

  clients-mac:
    name: clients-mac
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',clients,')
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/godot
      - id: clients
        uses: ./.github/actions/native
        with:
          layer: clients
      - name: Run layer clients-probes
        if: success() || steps.clients.outcome == 'failure'
        run: python3 scripts/ci_layer.py clients-probes
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: >-
          python3 scripts/ci_nightly.py verdict --job clients-mac --outcome "$STATUS"
          --layer clients --layer clients-probes
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-clients-mac
          path: artifacts/nightly/
          if-no-files-found: warn

  clients-windows:
    name: clients-windows
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',clients,')
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      # The clients' shared modules are symbolic links (W-11); without this they check out as text files.
      - name: Check symbolic links out as links
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The shared client modules are directories
        shell: bash
        run: |
          for module in clients/2d/mineworld clients/3d-spike/mineworld; do
            if [ ! -d "$module" ]; then
              echo "$module is not a directory: the symbolic link was checked out as a file (W-11)"
              exit 1
            fi
          done
      - uses: ./.github/actions/godot
      - uses: ./.github/actions/native
        with:
          layer: clients
      - name: Verdict
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
        run: python scripts/ci_nightly.py verdict --job clients-windows --outcome "$STATUS" --layer clients
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-clients-windows
          path: artifacts/nightly/
          if-no-files-found: warn

  # --------------------------------------------------------------------------------------- repeat
  # The unchanged default suite sampled twice more on this commit (flakes, §3.5). History-reading tests
  # need the full history (ARC-35), as `test` has it.
  repeat-linux:
    name: repeat-linux
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',repeat,')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/layer
        with:
          layer: core-repeat
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: python3 scripts/ci_nightly.py verdict --job repeat-linux --outcome "$STATUS" --layer core-repeat
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-repeat-linux
          path: artifacts/nightly/
          if-no-files-found: warn

  repeat-mac:
    name: repeat-mac
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',repeat,')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/native
        with:
          layer: core-repeat
      - name: Verdict
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: python3 scripts/ci_nightly.py verdict --job repeat-mac --outcome "$STATUS" --layer core-repeat
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-repeat-mac
          path: artifacts/nightly/
          if-no-files-found: warn

  repeat-windows:
    name: repeat-windows
    needs: gate
    if: needs.gate.outputs.run == 'true' && contains(needs.gate.outputs.groups, ',repeat,')
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/native
        with:
          layer: core-repeat
      - name: Verdict
        if: always()
        shell: bash
        env:
          STATUS: ${{ job.status }}
        run: python scripts/ci_nightly.py verdict --job repeat-windows --outcome "$STATUS" --layer core-repeat
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-repeat-windows
          path: artifacts/nightly/
          if-no-files-found: warn

  # --------------------------------------------------------------------------------------- report
  # The night's verdict, its summary, and the one issue. The only job with a write permission (13c QC-1),
  # through the automatic token; it fails iff the night is red.
  report:
    name: report
    needs:
      - gate
      - parity-long-linux
      - parity-long-arm
      - parity-long-mac
      - parity-long-windows
      - parity-long
      - stability-linux
      - stability-mac
      - stability-windows
      - clients-linux
      - clients-mac
      - clients-windows
      - repeat-linux
      - repeat-mac
      - repeat-windows
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - if: always() && needs.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-*
          path: reports
      - name: Report the night
        if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE_RUN: ${{ needs.gate.outputs.run }}
          GATE_GROUPS: ${{ needs.gate.outputs.groups }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          GATE_ISSUE: ${{ needs.gate.outputs.issue }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_nightly.py report --artifacts reports

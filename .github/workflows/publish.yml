# Publishing: GitHub's published release -> itch.io, after verification (S23 R-d; design
# .structured-coding/plans/mvp0/pr-s23-rd-publish.md sections 3 and 14).
#
# The live push is OFF unless the repository variable MINEWORLD_PUBLISH_LIVE is exactly `true`. With it
# unset, this workflow verifies the published bytes and logs "live publishing is off"; nothing reaches itch.io.
# Triggers: a published release (the operator presses Publish on a draft from release.yml) and a manual
# dispatch that only verifies a named draft. No pull_request trigger exists, so no fork can reach the key.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag or draft name to verify (a dispatch never publishes)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      rc: ${{ steps.gate.outputs.rc }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide whether this run publishes
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: python3 scripts/ci_release.py publish-gate --event "$EVENT" --tag "$TAG" --prerelease "$PRERELEASE" >> "$GITHUB_OUTPUT"

  verify:
    name: verify
    needs: gate
    if: needs.gate.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.publish == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.gate.outputs.tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      EVENT: ${{ github.event_name }}
      LIVE: ${{ vars.MINEWORLD_PUBLISH_LIVE }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Say whether live publishing is on
        run: |
          if [ "$LIVE" = "true" ]; then
            echo "live publishing is on: the push job will send this release to itch.io after approval"
          else
            echo "live publishing is off: this run verifies the published bytes and sends nothing to itch.io"
          fi
      - name: Download the release's assets into a scratch folder
        run: gh release download "$TAG" --repo "$REPO" --dir "$RUNNER_TEMP/assets"
      - name: Check the assets against SHA256SUMS
        run: |
          python3 scripts/ci_release.py verify-assets "$RUNNER_TEMP/assets" --version "$VERSION"
          cd "$RUNNER_TEMP/assets" && sha256sum -c SHA256SUMS
      - name: Verify each attestation (archives, SHA256SUMS, SBOM)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/assets"
          if [ "$EVENT" = "release" ]; then source_ref="--source-ref refs/tags/$TAG"; else source_ref=""; fi
          for file in *.zip *.tar.gz SHA256SUMS; do
            gh attestation verify "$file" --repo "$REPO" \
              --signer-workflow "$REPO/.github/workflows/release.yml" $source_ref
          done
          for file in *sbom.spdx.json; do
            gh attestation verify "$file" --repo "$REPO" --predicate-type https://spdx.dev/Document/v2.3 \
              --signer-workflow "$REPO/.github/workflows/release.yml" $source_ref
          done
      - name: Keep the verified assets for the push job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ needs.gate.outputs.tag }}
          path: ${{ runner.temp }}/assets
          retention-days: 1

  push:
    name: push to itch.io
    needs: [gate, verify]
    if: github.event_name == 'release' && needs.gate.outputs.publish == 'true' && vars.MINEWORLD_PUBLISH_LIVE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: itch
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.gate.outputs.version }}
      TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the verified assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: publish-${{ needs.gate.outputs.tag }}
          path: ${{ runner.temp }}/assets
      - name: Re-check every archive against SHA256SUMS after the artifact hop
        run: |
          python3 scripts/ci_release.py verify-assets "$RUNNER_TEMP/assets" --version "$VERSION"
          cd "$RUNNER_TEMP/assets" && sha256sum -c SHA256SUMS
      - name: Install butler, pinned by version and SHA-256 (DEP-39)
        env:
          BUTLER_SHA256: 5db7b053fc9b578b86ffaf3520a12b952eb95c9225171cc5720dfbc9fe4574b3
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/butler"
          gh release download v15.32.0 --repo itchio/butler --pattern butler-linux-amd64.zip --dir "$RUNNER_TEMP/butler"
          echo "$BUTLER_SHA256  $RUNNER_TEMP/butler/butler-linux-amd64.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/butler/butler-linux-amd64.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
          butler -V | grep -q 'v15.32.0'
      - name: Push each release archive to its itch channel
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          set -euo pipefail
          python3 scripts/ci_release.py itch-channels "$VERSION" > "$RUNNER_TEMP/channels.txt"
          while read -r target archive channel userversion hidden; do
            folder="$RUNNER_TEMP/bundles/$target"
            mkdir -p "$folder"
            case "$archive" in
              *.zip) unzip -q "$RUNNER_TEMP/assets/$archive" -d "$folder" ;;
              *) tar -xzf "$RUNNER_TEMP/assets/$archive" -C "$folder" ;;
            esac
            # A candidate's channel is created hidden and stays hidden; butler refuses --hidden on an existing channel.
            flag=""
            if [ "$hidden" = "yes" ] && ! butler status "$ITCH_TARGET:$channel" </dev/null >/dev/null 2>&1; then
              flag="--hidden"
            fi
            butler push "$folder/MineWorld-$VERSION-$target" "$ITCH_TARGET:$channel" \
              --userversion "$userversion" $flag </dev/null
          done < "$RUNNER_TEMP/channels.txt"
      - name: Report the channels
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: butler status "$ITCH_TARGET" </dev/null

# Runs one CI layer natively on the runner — macOS or Windows — rather than in the toolchain container
# (step-16 §16.12 PD-p1, §17.12 PD-q4; step-14 §13.0.3: the one native-runner definition every native
# job shares). The counterpart of .github/actions/layer, which is container-only.
#
# The caller has checked the repository out already. rustup takes rust-toolchain.toml's channel on the
# first cargo call; the Cargo caches are restored per OS and layer; `scripts/ci_layer.py <layer>` runs
# with the runner's own Python; target/ is pruned before the cache is saved. It names a layer, never a
# command: what a layer runs is scripts/ci_layer.py's (step-14 I-S13-9).
name: Run a CI layer natively
description: Restore caches, run scripts/ci_layer.py natively, prune the cache.
inputs:
  layer:
    description: >-
      A layer of scripts/ci_layer.py (platforms), or several separated by spaces, run in order (macOS's
      jobs, docs/DECISIONS.md ARC-110).
    required: true
  cache:
    description: The layer whose Cargo cache to restore and save; the default is `layer`.
    required: false
    default: ""
  shard:
    description: >-
      Optional K/N: run shard K of N of the layer (`core` and the nightly's `core-repeat`; docs/DECISIONS.md
      ARC-110, ARC-149). The Cargo cache key stays the layer's, so every shard restores the same dependencies.
    required: false
    default: ""
  archive:
    description: Directory containing the verified per-OS core archive, or empty for local builds.
    required: false
    default: ""
  select:
    description: >-
      An impact selection (scripts/ci_impact.py, the `changes` job's `impact_select`), as JSON: `core` runs
      only those packages and test targets (ARC-154's note of 2026-11-27). Empty: the whole layer.
    required: false
    default: ""
  areas:
    description: >-
      Comma-separated Python areas for `python --areas` (impact selection); empty runs every area.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Restore the Cargo caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: native-${{ runner.os }}-${{ inputs.cache || inputs.layer }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: native-${{ runner.os }}-${{ inputs.cache || inputs.layer }}-

    # The line endings the checkout produced are part of the evidence: on Windows, Git's default
    # core.autocrlf gives CRLF YAML and lock files, as a Windows user's checkout would (PD-p2, PD-q1).
    - name: Report the checkout's line endings
      shell: bash
      run: |
        echo "core.autocrlf: $(git config --get core.autocrlf || echo unset)"
        # Counted from the bytes (od), not with grep, which may read a file in text mode on Windows.
        # `|| true`: no match (an LF checkout) is a count of 0, not a failure under pipefail.
        crs=$({ od -An -c worlds/market-town/world.yaml | grep -o '\\r' || true; } | wc -l | tr -d ' ')
        echo "worlds/market-town/world.yaml: $crs carriage returns"

    # The `core` suite's test runner (docs/decisions/DEP-163.md): a prebuilt, checksummed binary, the same
    # version the Dockerfile's toolchain stage builds for Linux.
    - name: Install cargo-nextest
      uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
      with:
        tool: cargo-nextest@0.9.148

    - name: Run layer ${{ inputs.layer }} ${{ inputs.shard }}
      shell: bash
      env:
        LAYER: ${{ inputs.layer }}
        SHARD: ${{ inputs.shard }}
        ARCHIVE: ${{ inputs.archive }}
        SELECT: ${{ inputs.select }}
        AREAS: ${{ inputs.areas }}
        CARGO_INCREMENTAL: "0"
        CARGO_PROFILE_DEV_DEBUG: line-tables-only
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then python=python; else python=python3; fi
        read -r -a layers <<< "$LAYER"
        options=()
        if [ -n "$SHARD" ]; then options+=(--shard "$SHARD"); fi
        if [ -n "$ARCHIVE" ]; then options+=(--archive "$ARCHIVE"); fi
        if [ -n "$SELECT" ]; then
          mkdir -p artifacts && printf '%s' "$SELECT" > artifacts/ci-selection.json
          options+=(--select artifacts/ci-selection.json)
        fi
        if [ -n "$AREAS" ]; then options+=(--areas "$AREAS"); fi
        "$python" scripts/ci_layer.py "${layers[@]}" "${options[@]}"

    - name: Summarise failing tests
      if: always()
      shell: bash
      run: |
        if [ -s target/ci-failed-tests.md ]; then cat target/ci-failed-tests.md >> "$GITHUB_STEP_SUMMARY"; fi

    # nextest's JUnit (docs/decisions/DEP-163.md): every test's own time and verdict, for the shard weights
    # (`ci_shard.py --weigh`) and for reading a red run without its log. Absent for layers nextest does not run.
    - name: Name the JUnit artifact
      id: junit
      if: always() && (inputs.layer == 'core' || inputs.layer == 'platforms-lock core')
      shell: bash
      env:
        RAW: junit-${{ github.job }}-${{ runner.os }}-${{ inputs.layer }}-${{ inputs.shard }}
      run: echo "name=$(printf '%s' "$RAW" | tr ' /,:' '----')" >> "$GITHUB_OUTPUT"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && (inputs.layer == 'core' || inputs.layer == 'platforms-lock core')
      with:
        name: ${{ steps.junit.outputs.name }}
        path: target/nextest/ci/junit.xml
        if-no-files-found: ignore

    - name: Prune target/ before the cache is saved
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then python=python; else python=python3; fi
        "$python" scripts/ci_layer.py --prune-cache

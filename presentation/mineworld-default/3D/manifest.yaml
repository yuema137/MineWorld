# MineWorld default presentation style.
# The reference images in references/ are the source of truth; this file is their compact
# machine-readable summary (see docs/ART_DIRECTION.md §§15-16, §23).
id: mineworld-default-3d-realistic
name: MineWorld Default Realistic

dimension:
  - 3d

direction:
  realism: semi_realistic
  stylization: low
  detail_level: medium
  atmosphere: warm_calm
  environment_density: medium

characters:
  proportions: realistic
  # Deliberate and ruled on, not inferred: MineWorld Default 3D does not target
  # photorealistic human rendering. See docs/DECISIONS.md ARC-4.
  facial_detail: medium
  stylization: subtle

materials:
  physically_based: preferred
  texture_detail: medium

lighting:
  default: natural
  contrast: moderate
  preferred_conditions:
    - daylight
    - golden_hour
    - soft_overcast

environment:
  human_scale: true
  readability_priority: high

# Each reference states what it is authoritative FOR. A reference is the strongest
# source of truth within its designated dimensions and carries no authority outside
# them (docs/DECISIONS.md ARC-4).
reference_images:
  - path: references/01_lakeside_promenade.png
    authoritative_for: [environment, architecture, materials, lighting, colour, density, human_scale]
  - path: references/02_town_square.png
    authoritative_for: [environment, architecture, wayfinding, density, human_scale]
  - path: references/03_cafe_frontage.png
    authoritative_for: [environment, architecture, interaction_scale, outdoor_seating, signage]
  - path: references/04_character_closeup.png
    # ARC-19: the identity source of truth for the default character. Face, skin and hair are in
    # scope; ARC-4's earlier exclusion of them is superseded for this one image. The asset budget
    # stays out of scope: the reference shows a person, not a production cost.
    authoritative_for: [character_proportions, clothing, character_environment_integration, camera_distance, ordinary_person_identity, atmosphere, facial_fidelity, skin_rendering, hair_styling]
    not_authoritative_for: [character_asset_budget]
  - path: references/05_main_street_golden_hour.png
    authoritative_for: [architecture, materials, lighting, colour]
  - path: references/06_lake_trail.png
    authoritative_for: [natural_environment, vegetation, lighting, colour]

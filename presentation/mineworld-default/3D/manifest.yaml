# MineWorld default presentation style.
# The reference images in references/ are the source of truth; this file is their compact
# machine-readable summary (see docs/ART_DIRECTION.md §§15-16, §23).
id: mineworld-default-3d-realistic
name: MineWorld Default Realistic

dimension:
  - 3d

direction:
  realism: semi_realistic
  stylization: low
  detail_level: medium
  atmosphere: warm_calm
  environment_density: medium

characters:
  proportions: realistic
  facial_detail: medium
  stylization: subtle

materials:
  physically_based: preferred
  texture_detail: medium

lighting:
  default: natural
  contrast: moderate
  preferred_conditions:
    - daylight
    - golden_hour
    - soft_overcast

environment:
  human_scale: true
  readability_priority: high

reference_images:
  - references/01_lakeside_promenade.png
  - references/02_town_square.png
  - references/03_cafe_frontage.png
  - references/04_character_closeup.png
  - references/05_main_street_golden_hour.png
  - references/06_lake_trail.png

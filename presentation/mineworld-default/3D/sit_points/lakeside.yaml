  "sources": {
    "seat_height_m": "0.45 m: within VISUAL_SLICE sec.3.4 (0.42-0.47 m) and the 2010 ADA Standards sec.903.5 (bench seat 17-19 in, 430-485 mm above the finish floor); measured against the drawn seat by `--seat` (AC-f-2)",
    "seat_offset_m": "benches: the point 260 mm in front of the seat's front edge (SD-S34-3), the pelvis 0.45 / 0.40 m behind it, over the seat's middle (approximate); chairs: the point 260 mm behind the chair box's back face (Q-S34c-2, pr-s33f revision 2), the pelvis 0.57 m forward of it, over the seat's middle 60 mm toward the table from the box's centre (the pose sheet's seat middle, tools/character_pipeline/godot/pose_sheet.gd `_seated`)",
    "spacing": "600 mm per person on a bench (SD-S34-4, Q-S34-8); every pair >= 510 mm (posture's SIT_POINT_SPACING)"
  }

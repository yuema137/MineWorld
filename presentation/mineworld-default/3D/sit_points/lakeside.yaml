  "about": "How the 3D client draws a person seated at each of Lakeside's sit points (ARC-145, rewritten to S34's shape; step-34 sec.8.2; pr-s33f sec.5.2). A point is bound by its place's tags and its key. seat_height_m: the drawn seat's surface above the floor. seat_offset_m: how far the pelvis moves from the point's `at`, against its facing (positive: back onto a bench behind the point; negative: forward onto a chair in front of it, Q-S34c-2). prop: the furnishing whose seat it is (the world's `body: furnishings` key). fallback: the point's `at` (mm, the place's frame) and `facing` (millidegrees), for the shared sit rule's fallback branch while the world does not disclose sit points (Q-S33f-1 (A)); S34-c copies them into the place files verbatim and deletes them here (R-S34c-f-1). unless: place tags that must be absent, so a point of a room tagged only [station] is not bound to the ticket office or the platform off it, which carry [station] too (ARC-179). The halt's 13 points stand on S33-e2's benches (the world's bench rows, drawn by S29-e's bench row piece).",

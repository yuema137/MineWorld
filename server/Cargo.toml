[package]
name = "mineworld-server"
description = "The MineWorld world server: hosts one authoritative world and serves clients over HTTP and WebSocket, streaming a per-observer Observation and dispatching the intents they submit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# A hosted world may be persisted (S5). The server names no storage type: it holds a
# PersistentWorld, built by the composition root with whatever backend that chose.
mineworld-persistence = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The invite: made from the OS random source, compared in constant time (DEP-14). Both are named only
# in src/admission.rs.
getrandom = { workspace = true }
subtle = { workspace = true }
# The per-seat request budget (DEP-57), named only in src/seats.rs.
governor = { workspace = true }
# The world thread's CPU time per tick, for CP-B4's bound (DEP-59), named only in src/runtime/world.rs.
cpu-time = { workspace = true }

[dev-dependencies]
# The acceptance tests connect real WebSocket clients over a real TCP socket, so they need a
# client implementation: `tokio-tungstenite` is the client half of the stack DEP-3 chose, and
# `tungstenite` is already what axum's WebSocket support is built on.
tokio-tungstenite = { workspace = true }

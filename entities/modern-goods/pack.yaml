# The package identity of modern-goods, the repository's own Entity Pack (docs/DECISIONS.md ARC-71,
# ARC-77; docs/PACKAGE_FORMAT.md §5.0). Its kinds are the files in items/, each keyed by its name; a
# world uses them by requiring this pack (`requires: { modern-goods: "^0.2" }`) and naming this
# directory's parent as a pack root (`--packs entities`). It is a data pack: never "bundled" (ARC-54).
# 0.2.0: every kind has a display name (`item: { …, name }`, step-11 SD-D10, R-PK-2), which changes
# the facts a world requiring it declares (ARC-71 / ARC-77 notes of 2026-10-12).
id: modern-goods
type: entity-pack
version: 0.2.0
mineworld: "^0.1"
license: MIT
authors: [Yue Ma]
repository: https://github.com/yuema137/MineWorld

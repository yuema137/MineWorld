[package]
name = "mineworld-relationships"
description = "MineWorld's RelationshipsSystem: who knows whom, and how well, changed only by reducing the social facts other packs record."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# The vocabulary this pack reads, never a system dependency (DECISIONS.md ARC-28, step-09 Q6): the
# owners' published event types, so a payload is decoded with the type that wrote it — through
# `EventRecord::payload_for`, schema version checked — and never through a local copy of its shape.
mineworld-conversation = { workspace = true }
mineworld-group-activity = { workspace = true }
# For PerceptionProvider: the seam a pack discloses its own state through.
mineworld-presence = { workspace = true }
# What the build needs to know about this pack, said by the pack (DECISIONS.md ARC-33).
mineworld-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
mineworld-movement = { workspace = true }

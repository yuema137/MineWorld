[package]
name = "mineworld-attributes"
description = "MineWorld's attributes System Pack: a Person's declared attributes — the attributes/ and vocabularies/ data, the person file's attributes: section, the traits component, proposals, and disclosure filtered for each observer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The model every user of attributes shares; this pack is its one owner of state (ARC-120, ARC-124).
mineworld-attributes-model = { workspace = true }
# The seam a pack owns data and a section through (ARC-31, ARC-121).
mineworld-authoring = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# PerceptionProvider, and a person's place for a perceivable change. No system dependency.
mineworld-presence = { workspace = true }
# What the build needs to know about this pack, said by the pack (ARC-33).
mineworld-sdk = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
serde-saphyr = { workspace = true }

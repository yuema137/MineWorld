[package]
name = "mineworld-inventory"
description = "MineWorld's InventorySystem: what people and organizations hold, as counts of item kinds — the only writer of holdings, deciding every transfer another pack states through its checked constructor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The seam a pack owns a section of an authored file through: `holdings:` (ARC-31, ARC-36).
mineworld-authoring = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# For PerceptionProvider: the seam a pack discloses its own state through. No system dependency.
mineworld-presence = { workspace = true }
# What the build needs to know about this pack, said by the pack (DECISIONS.md ARC-33).
mineworld-sdk = { workspace = true }
# What a declared kind is (ARC-37). A sibling pack, named by path (MODULE_SPEC §3.1).
mineworld-item = { path = "../item" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The tests decode a section from YAML text as the loader does, and restart a saved world.
mineworld-persistence = { workspace = true }
serde-saphyr = { workspace = true }

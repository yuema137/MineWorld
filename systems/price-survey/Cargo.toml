[package]
name = "mineworld-price-survey"
description = "MineWorld's price-survey System Pack: a surveyor's price book of the asks it surveyed and the sales it perceived, disclosed to the surveyor only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The seam a pack owns a section of an authored file through: `price-survey:` (ARC-31, ARC-36).
mineworld-authoring = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# Where the surveyor stands, presence's audience rule (the witness rule calls it, ARC-43), and the
# perception trait.
mineworld-presence = { workspace = true }
# What the build needs to know about this pack, said by the pack (DECISIONS.md ARC-33).
mineworld-sdk = { workspace = true }
# `sold`'s published type (heard, ARC-28), and economy's own disclosure of listings and asks, which a
# survey copies (SD-S31c-3). A sibling pack, named by path (MODULE_SPEC §3.1).
mineworld-economy = { path = "../economy" }
# Item categories and `ItemKind`: the kinds filter.
mineworld-item = { path = "../item" }
# The section's JSON Schema, for the generated reference (DECISIONS.md ARC-90, DEP-49).
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The fixture seeds holdings and passages, and decodes sections from YAML as the loader does.
mineworld-inventory = { path = "../inventory" }
mineworld-movement = { workspace = true }
serde-saphyr = { workspace = true }

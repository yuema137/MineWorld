[package]
name = "mineworld-posture"
description = "MineWorld's PostureSystem: where a person may sit (sit points, authored as place data on free floor), who is seated on one, and the sit and stand actions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The seam a pack owns a section of an authored file through (DECISIONS.md ARC-31).
mineworld-authoring = { workspace = true }
# The Anchoring seam a seated person is held through: walkers stop short of them, shove is refused,
# and a sit point inside furniture is refused at load (S34-b, ARC-62 item 5).
mineworld-bodies = { path = "../bodies" }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# Whether a person is walking (`sit` while walking is Busy) and the walk-started fact a seated person
# stands up on (Q-S34-4).
mineworld-movement = { workspace = true }
# Where people are is presence's state: sitting moves a person through presence's `arrival`, and
# presence's `PerceptionProvider` is the seam this pack discloses and offers through.
mineworld-presence = { workspace = true }
# What the build needs to know about this pack, said by the pack (DECISIONS.md ARC-33), and the
# Interaction List section (ARC-63).
mineworld-sdk = { workspace = true }
# The section's JSON Schema, for the generated reference (DECISIONS.md ARC-90, DEP-49).
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The tests assemble scratch World Packs through the real loader, with this pack in the installed set,
# so sit points are read from a place file and the list from configure/posture.yaml; one world enables
# bodies (AC-a-9), and one is saved and resumed (AC-a-5).
mineworld-persistence = { workspace = true }
mineworld-test-support = { workspace = true }
mineworld-worldpack = { workspace = true }
# The tests decode a section from YAML text exactly as the World Pack loader does (DEP-10).
serde-saphyr = { workspace = true }

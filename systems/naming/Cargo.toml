[package]
name = "mineworld-naming"
description = "MineWorld's NamingSystem: a person's or a place's display name and its forms in other languages, authored in their World Pack file, seeded as a genesis fact and disclosed to whoever perceives them, plus the names over a place's doorways."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The seam a pack owns a section of an authored file through (DECISIONS.md ARC-31).
mineworld-authoring = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# Read only: movement's public Passages, for the name over each doorway (DECISIONS.md ARC-363). The
# optional pack depends on the fundamental one, so a world with movement and no naming builds as before.
mineworld-movement = { workspace = true }
# For PerceptionProvider: the seam a pack discloses its own state through. No system dependency.
mineworld-presence = { workspace = true }
# What the build needs to know about this pack, said by the pack (DECISIONS.md ARC-33).
mineworld-sdk = { workspace = true }
# The section's JSON Schema, for the generated reference (DECISIONS.md ARC-90, DEP-49).
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The tests decode a section from YAML text exactly as the World Pack loader does (DEP-10).
serde-saphyr = { workspace = true }

[package]
name = "mineworld-item"
description = "MineWorld's ItemSystem: what kinds of things exist. An item file's `item:` section becomes a genesis fact this pack alone reduces into the kind's ItemKind — the vocabulary the market packs share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The seam a pack owns a section of an authored file through: an item file's `item:` (ARC-31, ARC-36).
mineworld-authoring = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# For PerceptionProvider, which every installed pack implements: a place discloses the catalogue of
# kinds (ARC-37 note). No system dependency; items are never perceived as entities.
mineworld-presence = { workspace = true }
# What the build needs to know about this pack, said by the pack (DECISIONS.md ARC-33).
mineworld-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The tests decode a section from YAML text exactly as the World Pack loader does (DEP-10).
serde-saphyr = { workspace = true }

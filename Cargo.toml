[workspace]
members = [
    "authoring",
    "cognition/rule-controller",
    "contracts",
    "kernel",
    "packages",
    "persistence",
    "sdk/rust",
    "server",
    # Every System Pack, and the installed set: a pack's directory is a member without an edit here
    # (DECISIONS.md ARC-33). A new pack names its sibling packs by path, not below.
    "systems/*",
    "tests/acceptance",
    "tests/support",
    "tools/cli",
    # A developer tool, never part of a world's build: the only crate allowed an HTTP client, behind
    # its off-by-default `fetch` feature (DECISIONS.md DEP-31, step-19 INV-TW-7).
    "tools/weather-fetch",
    "worldpack",
]
resolver = "2"

# Shared metadata: every crate in this workspace is part of one release unit, so the
# version, edition and license live here rather than being restated per crate.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
authors = ["Yue Ma"]

# One authoritative version per dependency across the workspace. A crate that needs a
# dependency not listed here is adding a dependency, which is a reviewable decision.
[workspace.dependencies]
mineworld-authoring = { path = "authoring" }
mineworld-contracts = { path = "contracts" }
mineworld-naming = { path = "systems/naming" }
mineworld-kernel = { path = "kernel" }
mineworld-movement = { path = "systems/movement" }
mineworld-packages = { path = "packages" }
mineworld-persistence = { path = "persistence" }
mineworld-presence = { path = "systems/presence" }
mineworld-relationships = { path = "systems/relationships" }
mineworld-schedule = { path = "systems/schedule" }
mineworld-rule-controller = { path = "cognition/rule-controller" }
mineworld-sdk = { path = "sdk/rust" }
mineworld-conversation = { path = "systems/conversation" }
mineworld-group-activity = { path = "systems/group-activity" }
mineworld-installed-systems = { path = "systems/installed" }
mineworld-server = { path = "server" }
mineworld-worldpack = { path = "worldpack" }
# Test support only (DEP-29): a test's scratch directory, removed when the test ends. Never a
# [dependencies] entry of any crate.
mineworld-test-support = { path = "tests/support" }
serde ={ version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
serde_json = "1.0.151"
trybuild = "1.0.121"

# Durable local world state (DEP-2): SQLite compiled into the binary by the `bundled` feature, so a
# local server has no system dependency. Named only inside `persistence/src/sqlite.rs`.
rusqlite = { version = "0.40.2", features = ["bundled"] }

# YAML, for World Packs. `serde_yaml` is archived and every fork of its lineage sits on the
# archived `unsafe-libyaml`; `serde-saphyr` is a maintained parser with a stable major version, no
# unsafe code, positioned error reports and a duplicate-key policy. DEP-10 records the comparison.
# Only the deserializer is enabled: nothing in MineWorld writes YAML.
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }

# A pack's package identity (DEP-21), named only inside `packages/`: `semver` gives a range Cargo's own
# meaning, so `^0.1` in a pack.yaml admits what it admits in a Cargo.toml; `spdx` parses a licence
# expression against the SPDX list, which a list of exact strings cannot do.
semver = "1.0.28"
spdx = "0.13.6"

# The transport, frozen by DEP-3 / DEP-9: axum on tokio, HTTP and WebSocket. `futures-util`
# comes with the WebSocket: a socket is split into its two halves to read and write at once.
# `tokio-tungstenite` is the client half of the same stack and is a dev-dependency only —
# the server's acceptance tests open real sockets rather than mocking them.
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29.0"

# Join secrets (DEP-14): the OS random source makes an invite, and `subtle` compares an offered one in
# constant time. Named only inside `server/src/admission.rs`. `getrandom` 0.3 is already compiled
# through tungstenite's `rand`, so this adds an edge, not a second copy.
getrandom = "0.3.4"
subtle = "2.6.1"

# The `mineworld` command's argument parsing (DEP-11): named only in `tools/cli/src/main.rs`. `env`
# lets `--invite` come from MINEWORLD_INVITE (no new crate), with its value hidden from `--help`.
clap = { version = "4.6.6", features = ["derive", "env"] }

# The development profile every `cargo build` and `cargo test` uses (docs/DECISIONS.md ARC-30).
# Optimized at level 1 because the acceptance tests run real worlds for hundreds of simulated days:
# a 300-day run measured 50.3 s at level 0 and 8.4 s at level 1, with byte-identical output. The two
# checks that make a debug build a debug build are stated explicitly rather than inherited, so a later
# change to the level cannot quietly turn them off.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[package]
name = "mineworld-cli"
description = "The `mineworld` command: loads a World Pack and hosts it, or validates one and says what it is."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# One binary, named after the command rather than the crate: `mineworld server worlds/social-cafe`
# is the artefact `ARC-6` makes the deliverable.
[[bin]]
name = "mineworld"
path = "src/main.rs"

[dependencies]
# The composition root: the only crate in the workspace that depends on the transport, the System
# Packs AND a controller, which is what lets `mineworld-server` stay ignorant of what a conversation
# is and `mineworld-rule-controller` ignorant of how a request reaches a world.
clap = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-conversation = { workspace = true }
mineworld-kernel = { workspace = true }
# `biography` shows people by name, through naming's own projection of its own facts (ARC-31).
mineworld-naming = { workspace = true }
# `mineworld packs`: package identities, checked by the crate that says what a package is (ARC-53).
mineworld-packages = { workspace = true }
mineworld-persistence = { workspace = true }
mineworld-presence = { workspace = true }
mineworld-rule-controller = { workspace = true }
mineworld-server = { workspace = true }
mineworld-worldpack = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# The acceptance test starts the real binary and connects a real WebSocket client to it: the client
# half of the stack DEP-3 chose, and `futures-util` because a socket is split to read and write.
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
# The biography and Milestone B tests check what the command prints against the facts' own typed
# payloads, decoded with the owner packs' published types — an oracle independent of the envelope
# fields the command selects by (step-09 C6, rules §25).
mineworld-group-activity = { workspace = true }
mineworld-relationships = { workspace = true }
mineworld-schedule = { workspace = true }

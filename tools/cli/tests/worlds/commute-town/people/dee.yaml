# Dee lives nearest the bakery but works at the mill, about fourteen minutes away at `run`'s cadence.
# Her evening is at the bakery and she means to be home by 00:30: a punctual part whose departure falls
# before midnight (the midnight edge of `pr-le-leave-early.md` §4.9).
routine:
  - { from: "00:30", place: home-near, label: sleep, punctual: true }
  - { from: "13:00", place: mill, label: work, punctual: true }
  - { from: "19:00", place: bakery, label: evening }

location:
  place: home-near
  position: { x: 1000, y: 2000 }

economy: { wallet: 200000 }

job:
  employer: mill-co
  workplace: mill
  from: "13:00"
  until: "18:00"
  wage: 100

# Hunger and tiredness at the genesis levels (`needs` section, ARC-284).
needs: {}

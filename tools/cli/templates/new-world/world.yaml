# {id} — a new World Pack, written by `mineworld create`.
#
# A World Pack states population, places, capabilities and initial state. It states no rule: what
# an action requires belongs to the System Pack that provides it. The guide, `docs/guide/`, builds a
# world like this one step by step (start at `docs/guide/02-your-first-world.md`). Every field this
# file may use is listed in `docs/reference/world-pack.md`; a field the loader does not know is
# refused by name.
#
# Check it with `mineworld validate <this directory>`, watch it run with
# `mineworld run <this directory> --headless --seed 1 --days 7`, and host it with
# `mineworld server <this directory>`.

world:
  # Must match this pack's directory name.
  id: {id}
  name: {id}
  # The pack's own version and licence (docs/DECISIONS.md ARC-53).
  version: 0.1.0
  license: MIT  # set your own

# The framework versions this world is authored for.
mineworld: "^0.1"

# The capabilities this world asks for, in the order they are installed. `movement` and
# `conversation` depend on `presence`, so they come after it.
systems:
  - presence
  - movement
  - conversation

# Each key names a file in `places/`.
places:
  - home

# Everybody who exists here. Each key names a file in `people/`.
population:
  - first
  - second

# The people a controller — a client or an agent — may occupy.
seats:
  - first
  - second

# Not yet a town. A town names its station hall and its landmark: docs/MODULE_SPEC.md §4.3.
settlement:
  kind: none

# The repository's Python workspace root (pr-s10-p3-python-sdk.md D-P3-4; docs/DECISIONS.md DEP-S10-e).
#
# A virtual root: it is not a package and has no [project]. It names the workspace's members and holds
# the one uv.lock every member resolves through, so two members never resolve a shared dependency twice.
# The Cargo workspace (Cargo.toml) is unrelated to this file; no Rust crate depends on Python (I-2).

[tool.uv.workspace]
members = ["sdk/python", "cognition/lm-controller"]

# Pyright reads its configuration from the directory it runs in, and every check runs from the
# repository root (`uv run --locked pyright sdk/python`), so the configuration lives here and covers
# every member. Strict, as `.structured-coding/standards.md` declares.
[tool.pyright]
include = ["sdk/python", "cognition/lm-controller"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingModuleSource = "error"

# The repository's Python workspace root (pr-s10-p3-python-sdk.md D-P3-4; docs/DECISIONS.md DEP-S10-e).
#
# A virtual root: it is not a package and has no [project]. It names the workspace's members and holds
# the one uv.lock every member resolves through, so two members never resolve a shared dependency twice.
# The Cargo workspace (Cargo.toml) is unrelated to this file; no Rust crate depends on Python (I-2).

[tool.uv.workspace]
members = ["sdk/python", "cognition/lm-controller", "clients/agent"]

# Pyright reads its configuration from the directory it runs in, and every check runs from the
# repository root (`uv run --locked pyright sdk/python`), so the configuration lives here and covers
# every member. Strict, as `.structured-coding/standards.md` declares.
[tool.pyright]
include = ["sdk/python", "cognition/lm-controller", "clients/agent", "tools/onboarding"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingModuleSource = "error"
# The character pipeline (tools/character_pipeline, S26-b1) is not a workspace member. Its tests and driver import
# `mwcast` by its package name, so its root is an execution environment with its own directory on the import path.
# `include` is unchanged: the pipeline is checked by path (scripts/ci_layer.py).
executionEnvironments = [
    { root = "tools/character_pipeline", extraPaths = ["tools/character_pipeline"] },
]

# Test-only: tools/asset_generation's offline provenance test (CI `python` layer) imports `yaml` through
# mineworld_gen.provenance. Tooling, never a runtime dependency of any member (S26 cast-director review).
#
# The contact checks (S36-P1, tools/character_pipeline/mwcast/contact.py) need numpy and three mesh libraries. Tooling
# only, never a runtime dependency; only mwcast/contact.py imports them (invariant I-S36-1).
[dependency-groups]
dev = [
    "pyyaml>=6.0",
    "numpy==2.5.3",            # DEP-142: the arrays libigl and trimesh take; the tooling venv's pin
    "libigl==2.6.3",           # DEP-142: generalized winding number and point-mesh distance (MPL-2.0 core only)
    "trimesh==5.1.1",          # DEP-143: glTF scenes and the collision manager
    "python-fcl==0.7.0.11",    # DEP-143: the collision backend trimesh's CollisionManager calls
    "pillow>=10.0",            # tools/asset_generation's offline fit test (S29-f); already its requirement
]

[package]
name = "mineworld-attributes-model"
description = "The model of a Person's attributes: declarations decoded and checked with their line, one frozen catalogue per world, typed values and handles, derived values, the renderer and visibility filter, the owner interface, and the attributes pack's component and fact types."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# What every user of attributes depends on, instead of the `attributes` System Pack (DECISIONS.md
# ARC-124): it names no pack beyond the id `attributes` its vocabulary belongs to.
mineworld-authoring = { workspace = true }
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# The person section's JSON Schema, for the generated reference (ARC-90, DEP-49).
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Line and column of a declaration, kept for refusals that span its fields (DEP-10).
serde-saphyr = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# X-S30-11: a handle to a `text` attribute does not compile.
trybuild = { workspace = true }

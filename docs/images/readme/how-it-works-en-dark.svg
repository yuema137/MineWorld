<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 724" width="1600" height="724" role="img" aria-label="How a world is built: a world, rule modules and kinds of objects plug into one server with a small core. Players, scripts and AI only send requests. The server tells the 2D and 3D views what you see and what you can do, and saves every change.">

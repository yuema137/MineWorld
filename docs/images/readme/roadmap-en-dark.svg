<g font-size="21" fill="#a7b0bd">
<text x="48" y="180">A café town with jobs, money,</text>
<text x="48" y="212">friendships and a daily routine.</text>
<text x="48" y="244">Play it in 2D or 3D, alone or</text>
<text x="48" y="276">with friends.</text>
<text x="584" y="180">Towns linked by train, bus and</text>
<text x="584" y="212">taxi. Walk about on board.</text>

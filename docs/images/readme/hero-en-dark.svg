<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="MineWorld: build a living world, then walk into it.">
<rect width="1600" height="500" rx="24" fill="#10151c"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<text x="64" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="3" fill="#e0a458">OPEN SOURCE · MINEWORLD</text>
<text x="64" y="196" font-size="68" font-weight="600" fill="#e8ecf2">Build a living world,</text>
<text x="64" y="276" font-size="68" font-weight="600" fill="#e0a458">then walk into it.</text>
<text x="64" y="340" font-size="26" fill="#a7b0bd">Put people, places and rules together from modules.</text>
<text x="64" y="378" font-size="26" fill="#a7b0bd">One server keeps the world going; 2D and 3D are two ways to see it.</text>
<path d="M64 420 H1536" stroke="#2c3440" stroke-width="2"/>
<g font-size="21" fill="#a7b0bd">
<text x="64" y="466">Open source · MIT</text>
<text x="330" y="466">Runs with or without AI</text>
<text x="640" y="466">macOS · Linux · Windows</text>
<text x="1536" y="466" text-anchor="end" fill="#e0a458">Early preview (pre-alpha)</text>
</g>
<g font-size="22" fill="#e8ecf2">
<rect x="1026" y="72" width="250" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1052" cy="100" r="7" fill="#7fd19c"/><text x="1070" y="108">A town that lives</text>
<rect x="1290" y="72" width="246" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1316" cy="100" r="7" fill="#7fd19c"/><text x="1334" y="108">2D and 3D views</text>
<rect x="1026" y="144" width="250" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1052" cy="172" r="7" fill="#7fd19c"/><text x="1070" y="180">Rule modules</text>
<rect x="1290" y="144" width="246" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1316" cy="172" r="7" fill="#7fd19c"/><text x="1334" y="180">Your own rules</text>
<rect x="1026" y="216" width="250" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1052" cy="244" r="7" fill="#7fd19c"/><text x="1070" y="252">Play together</text>
<rect x="1290" y="216" width="246" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1316" cy="244" r="7" fill="#7fd19c"/><text x="1334" y="252">Save and replay</text>
<rect x="1026" y="288" width="250" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1052" cy="316" r="7" fill="#f0c060"/><text x="1070" y="324">AI characters</text>
<rect x="1290" y="288" width="246" height="56" rx="12" fill="#18202a" stroke="#2c3440" stroke-width="2"/>
<circle cx="1316" cy="316" r="7" fill="#f0c060"/><text x="1334" y="324">Many towns</text>
<g font-size="17" fill="#a7b0bd">
<circle cx="1034" cy="378" r="6" fill="#7fd19c"/><text x="1048" y="384">works today</text>
<circle cx="1182" cy="378" r="6" fill="#f0c060"/><text x="1196" y="384">on the way</text>
</g>
</g>
</g>
</svg>

<rect x="1300" y="600" width="276" height="100" rx="16" fill="#ffffff" stroke="#e3e0d8" stroke-width="2"/>
<rect x="420" y="280" width="740" height="240" rx="18" fill="#fff7ea" stroke="#b8792b" stroke-width="2.5"/>
<rect x="452" y="380" width="676" height="114" rx="12" fill="#ffffff" stroke="#e3e0d8" stroke-width="2"/>
<rect x="420" y="600" width="740" height="100" rx="16" fill="#ffffff" stroke="#e3e0d8" stroke-width="2"/>
<g stroke="#b8792b" stroke-width="2.5" fill="none">
<path d="M542 206V266"/><path d="M790 206V266"/><path d="M1038 206V266"/><path d="M1438 206V266"/>
<path d="M296 440H404"/><path d="M1162 335H1284"/><path d="M1162 465H1284"/><path d="M790 536V584"/>
</g>
<g fill="#b8792b">
<path d="M542 278l-8-14h16z"/><path d="M790 278l-8-14h16z"/><path d="M1038 278l-8-14h16z"/><path d="M1438 278l-8-14h16z"/>

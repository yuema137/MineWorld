<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 724" width="1600" height="724" role="img" aria-label="一个世界是怎么搭起来的：世界、规则模块和物品种类装进同一台服务器，服务器里有一个很小的核心。玩家、脚本和 AI 只发请求。服务器告诉 2D 和 3D 视图你能看到什么、能做什么，并保存每一次变化。">
<rect width="1600" height="724" rx="24" fill="#fbfaf7"/>
<rect x="420" y="24" width="244" height="180" rx="16" fill="#ffffff" stroke="#e3e0d8" stroke-width="2"/>

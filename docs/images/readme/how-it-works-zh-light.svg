</g>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<g font-size="18" letter-spacing="2" fill="#b8792b">
<text x="444" y="60">01 / 世界</text>
<text x="692" y="60">02 / 规则</text>
<text x="940" y="60">03 / 物品</text>
<text x="1324" y="60">05 / 外观</text>
<text x="48" y="316">04 / 大脑</text>
<text x="444" y="316">服务器</text>
<text x="444" y="636">保存的历史</text>
</g>
<g font-size="25" font-weight="600" fill="#1d2433">
<text x="444" y="104">里面有谁</text>
<text x="692" y="104">能发生什么</text>
<text x="940" y="104">有哪些东西</text>
<text x="1324" y="104">画成什么样</text>
<text x="48" y="360">谁来做决定</text>
<text x="444" y="358">让世界一直运转，哪怕没有人登录</text>
<text x="1324" y="344">2D 视图</text>
<text x="1324" y="474">3D 视图</text>
<text x="476" y="420" font-size="22">核心</text>
</g>
<g font-size="20" fill="#4a5568">
<text x="444" y="144">人、地方</text>
<text x="444" y="172">和物品</text>
<text x="692" y="144">聊天、买东西、</text>
<text x="692" y="172">上班、吃饭……</text>
<text x="940" y="144">咖啡、雨伞……</text>
<text x="940" y="172">多个世界可以共用</text>
<text x="1324" y="144">一套 2D 画风和</text>
<text x="1324" y="172">一套 3D 画风</text>
<text x="48" y="404">真人玩家</text>
<text x="48" y="438">简单的脚本</text>
<text x="48" y="472">AI 模型</text>
<text x="48" y="500" font-size="17" fill="#b8792b">（AI：即将到来）</text>
<text x="476" y="452">只知道有哪些东西、在哪、几点了、发生过什么。</text>
<text x="476" y="480">它不懂什么是工作，也不懂什么是钱。</text>
<text x="1324" y="372">点一下就走、就做</text>
<text x="1324" y="502">走过去按 E</text>
<text x="444" y="676">每一次变化和它的起因都记下来。重启或重放，还是同一个世界。</text>
<text x="48" y="640">关掉一个模块：</text>
<text x="48" y="666">它的动作没了，</text>
<text x="48" y="692">别的都不受影响。</text>
<text x="1324" y="640">视图和大脑只提请求，</text>
<text x="1324" y="668">由服务器来决定。</text>
</g>
<g font-size="17" fill="#8a5a1c">
<text x="302" y="414">请求：</text>
<text x="302" y="434">“买杯咖啡”</text>
<text x="1176" y="394">你能看到的</text>
<text x="1176" y="416">和能做的</text>
</g>
</g>
</svg>

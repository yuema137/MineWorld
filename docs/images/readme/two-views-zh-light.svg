<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="一个世界，两种看法：在 2D 里点 Alice，和在 3D 里走到她跟前，发给服务器的是同一个请求。服务器检查规则，把同样的回答发回两个视图。">
<rect width="1600" height="500" rx="24" fill="#fbfaf7"/>
<rect x="24" y="40" width="420" height="340" rx="16" fill="#ffffff" stroke="#e3e0d8" stroke-width="2"/>
<rect x="590" y="40" width="420" height="340" rx="18" fill="#fff7ea" stroke="#b8792b" stroke-width="2.5"/>
<rect x="1156" y="40" width="420" height="340" rx="16" fill="#ffffff" stroke="#e3e0d8" stroke-width="2"/>
<g stroke="#b8792b" stroke-width="2.5" fill="none">
<path d="M446 170H574"/><path d="M1154 170H1026"/>
<path d="M588 270H460"/><path d="M1012 270H1140"/>
</g>
<g fill="#b8792b">
<path d="M588 170l-14-8v16z"/><path d="M1012 170l14-8v16z"/>
<path d="M446 270l14-8v16z"/><path d="M1154 270l-14-8v16z"/>
</g>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<g font-size="18" letter-spacing="2" fill="#b8792b">
<text x="52" y="82">2D 视图</text>
<text x="618" y="82">服务器</text>
<text x="1184" y="82">3D 视图</text>
</g>
<g font-size="27" font-weight="600" fill="#1d2433">
<text x="52" y="130">你点一下 Alice，</text>
<text x="52" y="166">再选“说话”</text>
<text x="618" y="130">同一个世界</text>
<text x="1184" y="130">你走到 Alice 跟前，</text>
<text x="1184" y="166">按下 E</text>
</g>
<g font-size="20" fill="#4a5568">
<text x="52" y="318">从上往下看，</text>
<text x="52" y="346">插画风格</text>
<text x="618" y="176">Alice 在柜台后面。</text>
<text x="618" y="206">要说话，得离她 3 米以内。</text>
<text x="618" y="318">它检查规则，把发生的事记下来，</text>
<text x="618" y="346">再给出回答。</text>
<text x="1184" y="318">第一人称或第三人称，</text>
<text x="1184" y="346">写实风格</text>
</g>
<rect x="52" y="190" width="250" height="100" rx="10" fill="#fbf7ef" stroke="#e3e0d8" stroke-width="1.5"/>
<rect x="58" y="225" width="238" height="30" rx="6" fill="#f3e6cf"/>
<g font-size="18" fill="#1d2433">
<text x="70" y="216">走到 Alice 身边</text>
<text x="70" y="246">和 Alice 说话</text>
<text x="70" y="276">邀请 Alice……</text>
</g>
<rect x="618" y="232" width="364" height="42" rx="10" fill="#ffffff" stroke="#e3e0d8" stroke-width="1.5"/>
<text x="636" y="260" font-size="18" fill="#2f7d4f">✓ 已记下：你和 Alice 说了话</text>
<rect x="1184" y="196" width="364" height="88" rx="10" fill="#3a3f47"/>
<g font-size="18" fill="#ffffff">
<text x="1200" y="230">你：你好！来杯咖啡。</text>
<text x="1200" y="262">Alice：我记得你。</text>
</g>
<g font-size="17" fill="#8a5a1c" text-anchor="middle">
<text x="517" y="156">和 Alice 说话</text>
<text x="1083" y="156">和 Alice 说话</text>
<text x="517" y="300">同样的回答</text>
<text x="1083" y="300">同样的回答</text>
</g>
<text x="800" y="450" text-anchor="middle" font-size="22" fill="#4a5568">进去的是同一个请求，出来的是同一个世界。两种视图都不自己做决定。</text>
</g>
</svg>

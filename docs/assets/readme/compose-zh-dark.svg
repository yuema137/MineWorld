<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" aria-label="用 pack 拼出一个世界。Social Café、Market Town 和 Lakeside 在同一个没改过的内核上用了不同的 System Pack。">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;fill:#ecebe7}
.m{fill:#a3a29c} .b{font-weight:700} .s{font-weight:600}
.bg{fill:#16171a} .card{fill:#1f2125;stroke:#3a3d44;stroke-width:2}
.acc{fill:#2d2418;stroke:#e0a458;stroke-width:2.5} .acct{fill:#e0a458}
.layer{fill:#1f2125;stroke:#e0a458;stroke-width:1.5;stroke-opacity:.55}
.done{fill:#1d3326} .donet{fill:#7fd19c} .dones{stroke:#7fd19c}
.wip{fill:#3a2f17} .wipt{fill:#f0c060} .wips{stroke:#f0c060}
.plan{fill:#2a2e34} .plant{fill:#b4bcc8} .plans{stroke:#b4bcc8}
.vis{fill:#2a2340} .vist{fill:#b9a3f0} .viss{stroke:#b9a3f0}
.bad{fill:#3d2220;stroke:#f08a82;stroke-width:2} .badt{fill:#f08a82}
.in{stroke:#8ea6ff;stroke-width:3;fill:none} .int{fill:#8ea6ff}
.ob{stroke:#6cc5d6;stroke-width:3;fill:none;stroke-dasharray:8 6} .obt{fill:#6cc5d6}
.flow{stroke:#a3a29c;stroke-width:2.5;fill:none} .badl{stroke:#f08a82;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
.empty{fill:none;stroke:#3a3d44;stroke-width:2;stroke-dasharray:4 4}
.dot{fill:#e0a458} .code{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
</style>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8ea6ff"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6cc5d6"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#a3a29c"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#f08a82"/></marker>
</defs>
<rect width="1200" height="790" rx="24" class="bg"/>
<text x="40" y="56" font-size="30" class="b">用 pack 拼出一个世界</text>
<text x="40" y="88" font-size="17" class="m">仓库里的三个世界。内核相同，System Pack 不同，内核一行没改。</text>
<rect x="460" y="116" width="200" height="74" rx="14" class="acc"/>
<text x="560" y="146" font-size="19" class="b" text-anchor="middle">Social Café</text>
<text x="560" y="172" font-size="13" class="acct s" text-anchor="middle">咖啡馆小镇</text>
<rect x="680" y="116" width="200" height="74" rx="14" class="acc"/>
<text x="780" y="146" font-size="19" class="b" text-anchor="middle">Market Town</text>
<text x="780" y="172" font-size="13" class="acct s" text-anchor="middle">小镇加上钱</text>
<rect x="900" y="116" width="200" height="74" rx="14" class="acc"/>
<text x="1000" y="146" font-size="19" class="b" text-anchor="middle">Lakeside</text>
<text x="1000" y="172" font-size="13" class="acct s" text-anchor="middle">湖边村子</text>
<text x="40" y="160" font-size="15" class="m s">System Pack（规则）</text>
<rect x="40" y="206" width="1120" height="64" rx="12" class="card"/>
<text x="62" y="228" font-size="16" class="b">日常生活</text>
<text x="62" y="247" font-size="13" class="m">presence · movement · conversation · group-activity ·</text><text x="62" y="264" font-size="13" class="m">relationships · naming · schedule · appearance</text>
<circle cx="560" cy="238.0" r="15" class="dot"/>
<path d="M553,238.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="780" cy="238.0" r="15" class="dot"/>
<path d="M773,238.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1000" cy="238.0" r="15" class="dot"/>
<path d="M993,238.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="278" width="1120" height="64" rx="12" class="card"/>
<text x="62" y="300" font-size="16" class="b">性格</text>
<text x="62" y="319" font-size="13" class="m">persona</text>
<circle cx="560" cy="310.0" r="15" class="dot"/>
<path d="M553,310.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="780" cy="310.0" r="15" class="dot"/>
<path d="M773,310.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1000" cy="310.0" r="13" class="empty"/>
<rect x="40" y="350" width="1120" height="64" rx="12" class="card"/>
<text x="62" y="372" font-size="16" class="b">物品和吃喝</text>
<text x="62" y="391" font-size="13" class="m">item · inventory · item-transfer · consumption</text>
<circle cx="560" cy="382.0" r="13" class="empty"/>
<circle cx="780" cy="382.0" r="15" class="dot"/>
<path d="M773,382.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1000" cy="382.0" r="15" class="dot"/>
<path d="M993,382.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="422" width="1120" height="64" rx="12" class="card"/>
<text x="62" y="444" font-size="16" class="b">钱和工作</text>
<text x="62" y="463" font-size="13" class="m">economy · employment</text>
<circle cx="560" cy="454.0" r="13" class="empty"/>
<circle cx="780" cy="454.0" r="15" class="dot"/>
<path d="M773,454.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1000" cy="454.0" r="13" class="empty"/>
<rect x="40" y="494" width="1120" height="64" rx="12" class="card"/>
<text x="62" y="516" font-size="16" class="b">日期和天气</text>
<text x="62" y="535" font-size="13" class="m">calendar · weather</text>
<circle cx="560" cy="526.0" r="13" class="empty"/>
<circle cx="780" cy="526.0" r="15" class="dot"/>
<path d="M773,526.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1000" cy="526.0" r="13" class="empty"/>
<rect x="40" y="566" width="1120" height="64" rx="12" class="card"/>
<text x="62" y="588" font-size="16" class="b">钓鱼，来自另一个仓库</text>
<text x="62" y="607" font-size="13" class="m">fishing（第三方 pack，锁定到一个 commit）</text>
<circle cx="560" cy="598.0" r="13" class="empty"/>
<circle cx="780" cy="598.0" r="13" class="empty"/>
<circle cx="1000" cy="598.0" r="15" class="dot"/>
<path d="M993,598.0 l5,5 l9,-10" stroke="#1f2125" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="560" y1="642" x2="560" y2="660" class="flow" marker-end="url(#af)"/>
<line x1="780" y1="642" x2="780" y2="660" class="flow" marker-end="url(#af)"/>
<line x1="1000" y1="642" x2="1000" y2="660" class="flow" marker-end="url(#af)"/>
<rect x="40" y="664" width="1120" height="78" rx="14" class="layer"/>
<text x="62" y="696" font-size="19" class="b">内核：三个世界完全一样</text>
<text x="62" y="722" font-size="14" class="m">身份 · 组件 · 时间 · 空间 · 事件 · 存储。它不知道工作、钱或鱼是什么。</text>
<text x="40" y="764" font-size="15" class="m">世界在 world.yaml 里列出要用的 pack。关掉一个，它的动作就消失，其余照常运转。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="一个动作的一生：请求、由负责的 System 裁决、事件、写进事件记录、被观察。被拒绝的请求不改变世界，并返回原因。">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;fill:#1d1d1b}
.m{fill:#6b6a64} .b{font-weight:700} .s{font-weight:600}
.bg{fill:#fbfaf7} .card{fill:#ffffff;stroke:#e3e0d8;stroke-width:2}
.acc{fill:#fff4e2;stroke:#b8792b;stroke-width:2.5} .acct{fill:#b8792b}
.layer{fill:#ffffff;stroke:#b8792b;stroke-width:1.5;stroke-opacity:.55}
.done{fill:#e6f3ea} .donet{fill:#2f7d4f} .dones{stroke:#2f7d4f}
.wip{fill:#fbf0d9} .wipt{fill:#a46a00} .wips{stroke:#a46a00}
.plan{fill:#eceef1} .plant{fill:#5b6470} .plans{stroke:#5b6470}
.vis{fill:#f1ecfb} .vist{fill:#6a4fb3} .viss{stroke:#6a4fb3}
.bad{fill:#f8e3e1;stroke:#b3362f;stroke-width:2} .badt{fill:#b3362f}
.in{stroke:#3b5bdb;stroke-width:3;fill:none} .int{fill:#3b5bdb}
.ob{stroke:#1f7a8c;stroke-width:3;fill:none;stroke-dasharray:8 6} .obt{fill:#1f7a8c}
.flow{stroke:#6b6a64;stroke-width:2.5;fill:none} .badl{stroke:#b3362f;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
.empty{fill:none;stroke:#e3e0d8;stroke-width:2;stroke-dasharray:4 4}
.dot{fill:#b8792b} .code{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
</style>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3b5bdb"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f7a8c"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6b6a64"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3362f"/></marker>
</defs>
<rect width="1200" height="560" rx="24" class="bg"/>
<text x="40" y="56" font-size="30" class="b">一个动作的一生</text>
<text x="40" y="88" font-size="17" class="m">你买一杯咖啡。所有视图、所有 agent、每次重启，对发生了什么看法一致。</text>
<rect x="40" y="120" width="200" height="230" rx="16" class="card"/>
<circle cx="72" cy="154" r="16" class="dot"/>
<text fill="#ffffff" style="fill:#ffffff" x="72" y="160" font-size="16" class="b" text-anchor="middle">1</text>
<text x="98" y="161" font-size="20" class="b">请求</text>
<text x="60" y="202" font-size="14" class="m">你选了“买咖啡”。</text><text x="60" y="224" font-size="14" class="m">2D、3D、AI 角色</text><text x="60" y="246" font-size="14" class="m">或 agent 发的</text><text x="60" y="268" font-size="14" class="m">都是同一个请求。</text>
<line x1="244" y1="235.0" x2="266" y2="235.0" class="flow" marker-end="url(#af)"/>
<rect x="270" y="120" width="200" height="230" rx="16" class="acc"/>
<circle cx="302" cy="154" r="16" class="dot"/>
<text fill="#ffffff" style="fill:#ffffff" x="302" y="160" font-size="16" class="b" text-anchor="middle">2</text>
<text x="328" y="161" font-size="20" class="b">裁决</text>
<text x="290" y="202" font-size="14" class="m">由 economy System</text><text x="290" y="224" font-size="14" class="m">检查：在店里吗？</text><text x="290" y="246" font-size="14" class="m">钱够吗？</text><text x="290" y="268" font-size="14" class="m">有货吗？</text>
<line x1="474" y1="235.0" x2="496" y2="235.0" class="flow" marker-end="url(#af)"/>
<rect x="500" y="120" width="200" height="230" rx="16" class="card"/>
<circle cx="532" cy="154" r="16" class="dot"/>
<text fill="#ffffff" style="fill:#ffffff" x="532" y="160" font-size="16" class="b" text-anchor="middle">3</text>
<text x="558" y="161" font-size="20" class="b">事件</text>
<text x="520" y="202" font-size="14" class="m">一个事件，带原因：</text><text x="520" y="224" font-size="14" class="m">你付了钱，</text><text x="520" y="246" font-size="14" class="m">店里少了</text><text x="520" y="268" font-size="14" class="m">一杯咖啡。</text>
<line x1="704" y1="235.0" x2="726" y2="235.0" class="flow" marker-end="url(#af)"/>
<rect x="730" y="120" width="200" height="230" rx="16" class="card"/>
<circle cx="762" cy="154" r="16" class="dot"/>
<text fill="#ffffff" style="fill:#ffffff" x="762" y="160" font-size="16" class="b" text-anchor="middle">4</text>
<text x="788" y="161" font-size="20" class="b">存储</text>
<text x="750" y="202" font-size="14" class="m">写进事件记录。</text><text x="750" y="224" font-size="14" class="m">崩溃也不丢；</text><text x="750" y="246" font-size="14" class="m">同一个种子</text><text x="750" y="268" font-size="14" class="m">重放结果一样。</text>
<line x1="934" y1="235.0" x2="956" y2="235.0" class="flow" marker-end="url(#af)"/>
<rect x="960" y="120" width="200" height="230" rx="16" class="card"/>
<circle cx="992" cy="154" r="16" class="dot"/>
<text fill="#ffffff" style="fill:#ffffff" x="992" y="160" font-size="16" class="b" text-anchor="middle">5</text>
<text x="1018" y="161" font-size="20" class="b">观察</text>
<text x="980" y="202" font-size="14" class="m">能看见的人都看见：</text><text x="980" y="224" font-size="14" class="m">店里的人知道，</text><text x="980" y="246" font-size="14" class="m">镇子另一头的人</text><text x="980" y="268" font-size="14" class="m">不知道。</text>
<line x1="370.0" y1="354" x2="370.0" y2="402" class="badl" marker-end="url(#ab)"/>
<rect x="210" y="408" width="560" height="92" rx="14" class="bad"/>
<text x="230" y="438" font-size="17" class="b badt">或者被拒绝，并说明原因</text>
<text x="230" y="462" font-size="14" class="s">TooFarAway · Unavailable · Busy · PermissionDenied</text>
<text x="230" y="484" font-size="14" class="m">世界不变，原因发回给提请求的人。</text>
<text x="40" y="546" font-size="15" class="m">只有负责的 System 能改它自己的状态。客户端和 agent 只能提请求。</text>
</svg>

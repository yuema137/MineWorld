<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 786" width="1200" height="786" role="img" aria-label="Geant4 and MineWorld side by side: particle and Entity, physics process and System, physics list and Interaction List, reference lists, step and track and ActionIntent and Event, detector and observers.">
<style>
text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", Helvetica, Arial, sans-serif;fill:#1d1d1b}
.m{fill:#6b6a64} .b{font-weight:700} .s{font-weight:600}
.bg{fill:#fbfaf7} .card{fill:#ffffff;stroke:#e3e0d8;stroke-width:2}
.acc{fill:#fff4e2;stroke:#b8792b;stroke-width:2.5} .acct{fill:#b8792b}
.layer{fill:#ffffff;stroke:#b8792b;stroke-width:1.5;stroke-opacity:.55}
.done{fill:#e6f3ea} .donet{fill:#2f7d4f} .dones{stroke:#2f7d4f}
.wip{fill:#fbf0d9} .wipt{fill:#a46a00} .wips{stroke:#a46a00}
.plan{fill:#eceef1} .plant{fill:#5b6470} .plans{stroke:#5b6470}
.vis{fill:#f1ecfb} .vist{fill:#6a4fb3} .viss{stroke:#6a4fb3}
.bad{fill:#f8e3e1;stroke:#b3362f;stroke-width:2} .badt{fill:#b3362f}
.in{stroke:#3b5bdb;stroke-width:3;fill:none} .int{fill:#3b5bdb}
.ob{stroke:#1f7a8c;stroke-width:3;fill:none;stroke-dasharray:8 6} .obt{fill:#1f7a8c}
.flow{stroke:#6b6a64;stroke-width:2.5;fill:none} .badl{stroke:#b3362f;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
.empty{fill:none;stroke:#e3e0d8;stroke-width:2;stroke-dasharray:4 4}
.dot{fill:#b8792b} .code{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
</style>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3b5bdb"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1f7a8c"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6b6a64"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b3362f"/></marker>
</defs>
<rect width="1200" height="786" rx="24" class="bg"/>
<text x="40" y="56" font-size="30" class="b">A world is a physics list for people</text>
<text x="40" y="88" font-size="17" class="m">Geant4 builds a particle simulation from a chosen list of processes. MineWorld builds a world the same way.</text>
<rect x="40" y="112" width="480" height="54" rx="12" class="plan"/>
<text x="62" y="146" font-size="20" class="b plant">Geant4: particle physics</text>
<rect x="680" y="112" width="480" height="54" rx="12" class="acc"/>
<text x="702" y="146" font-size="20" class="b acct">MineWorld: a human world</text>
<rect x="40" y="184" width="480" height="66" rx="12" class="card"/>
<text x="62" y="212" font-size="17" class="b">Particle</text>
<text x="62" y="235" font-size="13" class="m">electron, photon, proton: exists on its own</text>
<rect x="680" y="184" width="480" height="66" rx="12" class="card"/>
<text x="702" y="212" font-size="17" class="b">Entity</text>
<text x="702" y="235" font-size="13" class="m">Person, Place, Item, Organization: exists on its own</text>
<line x1="530" y1="217.0" x2="670" y2="217.0" class="flow" marker-start="url(#af)" marker-end="url(#af)"/>
<rect x="40" y="260" width="480" height="66" rx="12" class="card"/>
<text x="62" y="288" font-size="17" class="b">Physics process</text>
<text x="62" y="311" font-size="13" class="m">code that lets particles interact, e.g. scattering</text>
<rect x="680" y="260" width="480" height="66" rx="12" class="card"/>
<text x="702" y="288" font-size="17" class="b">System</text>
<text x="702" y="311" font-size="13" class="m">a System Pack that owns one kind of interaction: talk, buy, work</text>
<line x1="530" y1="293.0" x2="670" y2="293.0" class="flow" marker-start="url(#af)" marker-end="url(#af)"/>
<rect x="40" y="336" width="480" height="66" rx="12" class="acc"/>
<text x="62" y="364" font-size="17" class="b">Physics list</text>
<text x="62" y="387" font-size="13" class="m">which processes apply to which particles</text>
<rect x="680" y="336" width="480" height="66" rx="12" class="acc"/>
<text x="702" y="364" font-size="17" class="b">Interaction List</text>
<text x="702" y="387" font-size="13" class="m">which interactions exist, between whom, under which rules</text>
<line x1="530" y1="369.0" x2="670" y2="369.0" class="flow" marker-start="url(#af)" marker-end="url(#af)"/>
<rect x="40" y="412" width="480" height="66" rx="12" class="card"/>
<text x="62" y="440" font-size="17" class="b">Reference list</text>
<text x="62" y="463" font-size="13" class="m">FTFP_BERT, QBBC: chosen by name, a module swapped</text>
<rect x="680" y="412" width="480" height="66" rx="12" class="card"/>
<text x="702" y="440" font-size="17" class="b">Reference list</text>
<text x="702" y="463" font-size="13" class="m">each pack's default; a world extends it and changes one entry</text>
<line x1="530" y1="445.0" x2="670" y2="445.0" class="flow" marker-start="url(#af)" marker-end="url(#af)"/>
<rect x="40" y="488" width="480" height="66" rx="12" class="card"/>
<text x="62" y="516" font-size="17" class="b">Step and track</text>
<text x="62" y="539" font-size="13" class="m">one interaction; a particle's path, step by step</text>
<rect x="680" y="488" width="480" height="66" rx="12" class="card"/>
<text x="702" y="516" font-size="17" class="b">ActionIntent → Event</text>
<text x="702" y="539" font-size="13" class="m">one resolved interaction; each entity's history, in order</text>
<line x1="530" y1="521.0" x2="670" y2="521.0" class="flow" marker-start="url(#af)" marker-end="url(#af)"/>
<rect x="40" y="564" width="480" height="66" rx="12" class="card"/>
<text x="62" y="592" font-size="17" class="b">Detector</text>
<text x="62" y="615" font-size="13" class="m">records only what passes through it</text>
<rect x="680" y="564" width="480" height="66" rx="12" class="card"/>
<text x="702" y="592" font-size="17" class="b">Observers</text>
<text x="702" y="615" font-size="13" class="m">2D, 3D, AI characters, agents: each sees only what it perceives</text>
<line x1="530" y1="597.0" x2="670" y2="597.0" class="flow" marker-start="url(#af)" marker-end="url(#af)"/>
<rect x="680" y="646" width="480" height="112" rx="12" class="layer"/>
<text x="702" y="674" font-size="14" class="s acct">configure/conversation.yaml, one rule</text>
<text x="702" y="700" font-size="14" class="code" xml:space="preserve">rules:</text><text x="702" y="722" font-size="14" class="code" xml:space="preserve">  - { action: talk, actor: noble,</text><text x="702" y="744" font-size="14" class="code" xml:space="preserve">      target: commoner, effect: forbid }</text>
<text x="40" y="680" font-size="20" class="b">Same engine, different list,</text><text x="40" y="712" font-size="20" class="b">different world.</text>
<text x="40" y="752" font-size="14" class="m">Without the conversation System, no one can talk.</text><text x="40" y="772" font-size="14" class="m">With it, the Interaction List says who may talk to whom.</text>
</svg>

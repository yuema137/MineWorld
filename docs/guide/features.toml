# Which executable-guide features are merged (docs/GUIDE_FORMAT.md §9). A block that says `requires X` runs
# only when X = true here, and the test fails if a flag disagrees with what the build shows (§9.1).
[features]
interaction-list = true
calendar = true
weather = true
decisions = true
motivated = true
lm-controller = true       # P6b: the decision model `lm`; its pages come in a later guide update
relationship-decay = true
memory-policies = false    # no probe: a policy acts only in a cognition process, which P6 brings (§9.1)
happenings = false         # WE-a

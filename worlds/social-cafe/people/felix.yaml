# Felix — in the convenience store, between the shelves.
#
# A customer, not the person who runs it: who runs a shop is employment, which this world does not
# install (`places/store.yaml`).

name: Felix Okafor

# His day (schedule's `routine`, ARC-32). Boundaries stay within 05:00–23:00: a fixture dependency of
# the restart tests, explained in alice.yaml and checked by those tests.
routine:
  - { from: "09:00", place: store, label: errands }
  - { from: "10:00", place: cafe, label: coffee }
  - { from: "12:00", place: park, label: walk }
  - { from: "16:00", place: store, label: errands }
  - { from: "18:00", place: apartments, label: home }

tags:
  - neighbour

note: Pops into the store for whatever he forgot.

location:
  place: store
  position:
    x: 3000
    y: 3000

# Alice — behind the counter, facing the room.
#
# `name` is a section the `naming` system owns (docs/DECISIONS.md ARC-31): it becomes her display
# name, reduced by that system and shown to whoever can see her. `tags` reach a client too, through
# the observation; the key `alice` never does.
#
# The counter's staff face is 7.35 m in from the front wall; she stands 0.65 m behind it, so a
# customer at the counter is within `conversation`'s three-metre reach and somebody at the front door
# is not. That range is the conversation system's policy and is not restated here.

name: Alice Moreau

tags:
  - barista
  - staff

note: Runs the counter. Speaks to whoever comes in.

location:
  place: cafe
  # 6.0 m along the counter from the west wall, 8.0 m into the room.
  position:
    x: 6000
    y: 8000
  # Facing south, across the counter and down the room toward the door, in millidegrees.
  facing: 180000

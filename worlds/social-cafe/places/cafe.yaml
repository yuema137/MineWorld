# The café: one room, with an origin the positions in `people/` are measured from.
#
# Millimetres from that origin, on the world's own axes — `x` and `y` across the floor, `z` up. What
# the origin *is* is this world's business; the contract only requires that two positions in one
# place be comparable (`contracts/src/spatial.rs`).

tags:
  - cafe
  - public

note: >-
  A small café with a counter along one wall and two tables, and a front door onto the street.

# The front door. `here` is where it is in the café — 400 mm past where the visitor is seated —
# and `there` where the same door is on the street. Where it is, not how near one must be to use it:
# that is the movement system's rule (`docs/DECISIONS.md` `ARC-26`).
passages:
  - to: street
    here:
      x: 5000
      y: 200
    there:
      x: 0
      y: 3000

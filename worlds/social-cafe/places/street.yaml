# The street: the town's one thoroughfare, and the place every other place opens onto.
#
# Millimetres from the street's own origin; `x` east along the street, `y` north
# (`docs/CORE_CONCEPTS.md` §6.1). The north façades stand at `y` 3 200 and the south ones at −13 000;
# every doorway point lies 0.4 m in front of its façade, on a door the 3D slice draws: on the north side
# the café's at `x` 0, The Flower Room's (the store) 8.39 m east and the Flats' (the apartments)
# 19.7 m west; on the south side the office's house door 5.7 m west and the park's 15.3 m east. Each of
# those passages is stated once, in the other place's file, and holds both ways
# (`docs/MODULE_SPEC.md` §4.1).
#
# Every place joins the street and nothing else, so any place is at most two doors from any other:
# out onto the street, and in through the next.

tags:
  - street
  - public

note: >-
  The pavement and road that join the café, the apartments, the store, the park and the office.
  Somewhere to step out to, and the way from any place to any other.

# Owned by the `bodies` system (`ARC-39`): the floor between the façades and the street's two ends, and
# the 62 solids the 3D slice collides with on it, as boxes (step-11 §19.3.1, E-TD1). A slice cylinder
# is held by its inscribed square (radius ≤ 500 mm) or by two crossed boxes (the terrace tables); each
# box is within 150 mm of the slice's collider. One slice collider is left out by name: a tree on the
# east bank whose foliage overhangs the pavement 1.66 m up — an overhang a floor-standing box cannot
# hold (step-11 §19.13, TD-D4's amendment; FU-12d-1).

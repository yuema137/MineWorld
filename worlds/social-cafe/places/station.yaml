# The station hall: the waiting room of the town's railway station, after the Santa Fe Depot, San Diego
# (1915; NRHP 72000248; HABS CA-1965). 51.8 m by 16.8 m inside (real: the main waiting room, 170 × 55 ft),
# its long axis north–south, its east façade on the street's axis. Millimetres from its inner south-west
# corner; x east, y north (docs/CORE_CONCEPTS.md §6.1).
#
# Three doors: the arch on the east façade onto the street's forecourt, the ticket window's bay off the
# south end, and the platform through the west wall. Each passage is stated once; the bay's and the
# platform's are in their own files.

tags:
  - station
  - public
  - landmark

note: >-
  The station's waiting hall: oak benches in rows, a high timber ceiling, a tiled wainscot. The ticket
  window is off the south end; the platform is through the doors on the west side.

passages:
  # The arch on the east façade, 0.4 m inside; in the street, 0.4 m in front of the façade (design).
  - to: street
    here: { x: 16400, y: 25900 }
    there: { x: -62050, y: -4900 }

# Owned by the `bodies` system (ARC-39). 34 bench rows (seat 450 mm; each 6 000 × 600 mm; 1 800 mm
# between rows; aisles 1 200 mm at the side walls and 2 400 mm down the centre) and the kiosk (design).
# Row k of each bank runs y 6 000 + 2 400 k to 6 600 + 2 400 k, k = 0 … 16; every bench faces north, to
# the departures board on the north wall. The doorways (16 400, 25 900), (400, 25 900) and (8 400, 400)
# lie in aisles.
# The furnishings (`ARC-307`) are the free-standing pieces; each is named by the solids a body meets
# (`furnishing:`). A solid that names none is the building's shell. Facing: millidegrees clockwise
# from north (0 north, 90 000 east).

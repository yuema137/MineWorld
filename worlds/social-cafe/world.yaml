# Social Café — the world the vertical slice is set in.
#
# A World Pack states population, places, capabilities and initial state. It states no rule: what
# `talk` requires of space belongs to the conversation system, not to this file
# (`docs/MODULE_SPEC.md` §4). It holds no secret and no endpoint either — the operator supplies
# those.
#
# The fields this file may use are specified in `docs/MODULE_SPEC.md` §4.1. A field the loader does
# not implement is refused by name rather than ignored, because a silently ignored field is a world
# its author believes they authored.

world:
  # Must match this pack's directory name: a pack with two identities has none.
  id: social-cafe
  name: Social Café

# The capabilities this world asks for, in the order they are installed — which is the order their
# reducers run in, so it is the pack's statement and not a sort. `movement` and `conversation` each
# declare a dependency on `presence`, so they come after it. Without `movement`, nobody here could
# walk: `move` would be answered unavailable and the world would otherwise be the same.
systems:
  - presence
  - movement
  - conversation

# The café, and the street outside its front door. The two are joined by a doorway, so a person can
# walk out and back in; travel between places that do not adjoin is still out of this slice.
places:
  - cafe
  - street

# Everybody who exists here. Each key names a file in `people/`.
population:
  - alice
  - bob
  - visitor
  - wanderer

# The seats a **controller** may occupy — a human client or an agent, because nothing about the world
# distinguishes them (`INV-1`). A seat is an existing Person, named by its authoring key: whoever
# connects asks for a seat and the server resolves which entity that is, so nothing outside the world
# ever names an entity.
#
# Two of them are for players, because `AC-15` puts two clients in one world and two observers are two
# people. The third is Alice, and it is what lets `mineworld server ... --agent alice` drive her
# through exactly the path a player's client uses rather than through a privileged one. That a human
# could occupy her instead is `AC-5`'s direction, not an oversight: mixed control is normal, and which
# Person is driven by what is a fact about this world's configuration rather than about the person
# (`MODULE_SPEC.md` §5).
seats:
  - visitor
  - wanderer
  - alice

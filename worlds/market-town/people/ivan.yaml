# Ivan — on the pavement, 4 m west of the café's door.

name: Ivan Petrov
appearance: { look: ivan-petrov }

# His day (schedule's `routine`, ARC-32). Boundaries stay within 05:00–23:00: a fixture dependency of
# the restart tests, explained in alice.yaml and checked by those tests.
# The station: the town's meeting point (step-29 §7.1). His station part is `punctual` (ARC-280): it is his
# shift at the newsstand. A controller would keep the shift without the flag too (S35 N-h R6), but the
# routine says what he means to do.
routine:
  - { from: "07:00", place: station, label: meet, punctual: true }
  - { from: "12:00", place: cafe, label: chat }
  - { from: "16:00", place: park, label: walk }
  - { from: "20:00", place: apartments, label: home }

tags:
  - passerby

note: Walks the street a lot, and stops to talk to anyone who will.

location:
  place: street
  position:
    x: -4000
    y: 1000

# Market Town: what he carries at the start (inventory's `holdings`, ARC-37; see alice.yaml).
holdings: { apple: 1, coffee: 1, mug: 1 }

# Market Town: his money (economy's section, ARC-38; see alice.yaml). No job: an endowment for the
# measured horizon (ARC-38, L-13).
economy: { wallet: 200000 }

# Market Town: his job (employment's section, ARC-38; see alice.yaml). His routine already has him in the
# station hall from 07:00 to 12:00 (the town's meeting point, step-29 §7.1), and in Social Café too, so the
# job fits the day he keeps in both towns (docs/decisions/ARC-35.md, AC-1 check 3). He keeps the newsstand
# for Station News; a full shift brings in the day's papers.
job:
  employer: station-news
  workplace: station
  from: "07:00"
  until: "12:00"
  wage: 120
  produces: { newspaper: 8 }

# `persona` is a section the `persona` system owns (ARC-74), the same as in Social Café: it shapes how
# this person speaks and grants nothing; it is disclosed to their own seat alone.
persona:
  summary: Walks the street a lot and stops to talk to anyone who will. Curious about everything.
  traits: [chatty, curious]
  speech: Long, rambling sentences.

# Market Town: hunger and tiredness (`needs` section, ARC-284). `{}` takes the genesis levels, hunger 300
# and tiredness 700; the rates are configure/needs.yaml's.
needs: {}

note: Works across the street from the café, and knows its menu by heart.

location:
  place: workplace
  position:
    x: 3000
    y: -3000

# Market Town: what she carries at the start (inventory's `holdings`, ARC-37; see alice.yaml).
holdings: { candle: 1, soap: 1, umbrella: 1 }

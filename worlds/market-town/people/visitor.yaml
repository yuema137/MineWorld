# The visitor — the Person a client occupies, listed as a seat in `world.yaml`.
#
# Nothing in this file marks it as playable. A seat is the world host's decision, stated in
# `world.yaml`, because whether a Person can be driven by a client is a fact about the world's
# configuration rather than about the person.
#
# Just inside the front door, at the start of the lane to the counter: out of conversational range
# of both of the others on arrival (6.2 m to Bob, 8.6 m to Alice, against a three-metre range), so
# that walking up to the counter is something a client does and is answered for.

name: Vera Lindgren

# Her day (schedule's `routine`, ARC-32) — a plan a player may follow or ignore: it is disclosed to her
# seat and moves her nowhere. Boundaries stay within 05:00–23:00: a fixture dependency of the restart
# tests, explained in alice.yaml and checked by those tests.
routine:
  - { from: "08:00", place: cafe, label: visit }
  - { from: "12:00", place: park, label: sightsee }
  - { from: "16:00", place: store, label: shopping }
  - { from: "20:00", place: apartments, label: stay }

tags:
  - visitor

note: The player. Arrives at the door.

location:
  place: cafe
  position:
    x: 1610
    y: 600

# Market Town: what the visitor carries at the start (inventory's `holdings`, ARC-37; see alice.yaml).
holdings: { apple: 1, scarf: 1 }

# Market Town: the visitor's money (economy's section, ARC-38; see alice.yaml). No job: an endowment
# for the measured horizon (ARC-38, L-13).
economy: { wallet: 200000 }

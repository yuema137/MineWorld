# Felix — in the convenience store, between the shelves.
#
# A customer, not the person who runs it: who runs a shop is employment, which this world does not
# install (`places/store.yaml`).

name: Felix Okafor
appearance: { look: felix-okafor }

# His day (schedule's `routine`, ARC-32). Boundaries stay within 05:00–23:00: a fixture dependency of
# the restart tests, explained in alice.yaml and checked by those tests. His store part is `punctual`
# (PR LE, ARC-280): he means to be there at 08:00, so he sets out early enough to arrive by it.
routine:
  - { from: "08:00", place: store, label: errands, punctual: true }
  - { from: "13:00", place: cafe, label: coffee }
  - { from: "17:00", place: apartments, label: home }

tags:
  - neighbour

note: Pops into the store for whatever he forgot.

location:
  place: store
  position:
    x: 3000
    y: 3000

# Market Town: what he carries at the start (inventory's `holdings`, ARC-37; see alice.yaml).
holdings: { juice: 1, sandwich: 1 }

# Market Town: his money (economy's section, ARC-38; see alice.yaml).
economy: { wallet: 20000 }

# Market Town: his job (employment's section, ARC-38; see alice.yaml). His routine already has him in
# the store from 08:00 to 13:00, and he starts the day there.
job:
  employer: corner-store
  workplace: store
  from: "08:00"
  until: "13:00"
  wage: 200
  produces: { apple: 4, bread: 2, milk: 2, juice: 2 }

# `persona` is a section the `persona` system owns (ARC-74), the same as in Social Café: it shapes how
# this person speaks and grants nothing; it is disclosed to their own seat alone.
persona:
  summary: Pops into the store for whatever he forgot. Cheerful, and forever going back for one more thing.
  traits: [cheerful, absent-minded]
  speech: Quick, casual sentences.

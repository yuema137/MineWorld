# The café: one room, with an origin the positions in `people/` are measured from.
#
# Millimetres from that origin, on the world's own axes — `x` east and `y` north across the floor, `z`
# up (`docs/CORE_CONCEPTS.md` §6.1). What the origin *is* is this world's business; the contract only
# requires that two positions in one place be comparable (`contracts/src/spatial.rs`).
#
# Here the origin is the room's inner south-west corner: the inner face of the west wall where it meets
# the inner face of the front wall, which looks south onto the street. The room runs 8.32 m east and
# 10.32 m north from it. The layout is the 3D slice's, which follows reference image `03`: the front
# door near the west end of the shopfront, a clear lane from it to the counter, the counter across the
# back of the room from 3.86 m to the east wall, and its customer face 6.57 m in from the front wall.

tags:
  - cafe
  - public

note: >-
  A small café with a counter across the back of the room, tables by the window and in the room, and
  a front door onto the street.

# The front door. `here` is where it is in the café — 1.61 m along the front wall from the west wall
# and 0.4 m into the room, where a person fits (the `bodies` system refuses a doorway point closer than
# a person's radius and a gap, 260 mm, to a wall or a solid) — and `there` where the same door is on the street, 0.4 m in front of the
# shopfront. Where it is, not how near one must be to use it: that is the movement system's rule
# (`docs/DECISIONS.md` `ARC-26`).
passages:
  - to: street
    here:
      x: 1610
      y: 400
    there:
      x: 0
      y: 2800

# Owned by the `bodies` system (`ARC-39`): the floor — its edge is the room's walls — and every solid
# the 3D slice collides with on it, as boxes in this frame (step-11 §19.3.1 and its evidence E-TD1).
# Each matches the slice's collider within 150 mm, with three named departures: the open door leaf is a
# diagonal board, held here by its axis-aligned box; and the north table's south face stands 37 mm
# inside the slice's collider, at y 4 160, so the wanderer at (7 110, 3 900) keeps a radius and the gap
# (260 mm) from it (step-11 §19.13, TD-D4).
#
# The furnishings (`ARC-307`) are the free-standing pieces: what stands where, facing which way, and of
# what kind. Both clients draw them from here — a Presentation Pack picks the look by `kind` — so no
# client script places a table or a chair. Each is named by the solids a body meets (`furnishing:`); a
# solid that names none is the room's shell (counter, worktop, window bench and ledge, dresser, door
# leaf, back-room board), drawn by the client's depiction of the room. Facing: millidegrees clockwise
# from north (0 north, 90 000 east).
body:
  floor: { min: { x: 0, y: 0 }, max: { x: 8320, y: 10320 } }
  furnishings:
    # the three round tables, and two chairs at each, each chair facing its table
    - { key: table.east, kind: table.round, at: { x: 4860, y: 3160 }, facing: 171406 }
    - { key: table.east.chair-w, kind: chair.dining, at: { x: 4200, y: 3060 }, facing: 81406 }
    - { key: table.east.chair-e, kind: chair.dining, at: { x: 5540, y: 3240 }, facing: 261406 }
    - { key: table.north, kind: table.round, at: { x: 7110, y: 4560 }, facing: 192605 }
    - { key: table.north.chair-w, kind: chair.painted, at: { x: 6450, y: 4460 }, facing: 102605 }
    - { key: table.north.chair-e, kind: chair.painted, at: { x: 7790, y: 4640 }, facing: 282605 }
    - { key: table.back, kind: table.round, at: { x: 2260, y: 8560 }, facing: 175416 }
    - { key: table.back.chair-w, kind: chair.dining, at: { x: 1600, y: 8460 }, facing: 85416 }
    - { key: table.back.chair-e, kind: chair.dining, at: { x: 2940, y: 8640 }, facing: 265416 }
    # the three stools at the drinks ledge
    - { key: stool.1, kind: stool.bar, at: { x: 3160, y: 1660 }, facing: 0 }
    - { key: stool.2, kind: stool.bar, at: { x: 4760, y: 1660 }, facing: 354270 }
    - { key: stool.3, kind: stool.bar, at: { x: 6360, y: 1660 }, facing: 348541 }
    # the display shelves on the west wall, the shelf unit on the east wall, and two potted plants
    - { key: shelves.west, kind: shelves.display, at: { x: 340, y: 5710 }, facing: 90000 }
    - { key: shelves.east, kind: shelves.wall, at: { x: 7960, y: 2010 }, facing: 270000 }
    - { key: plant.front, kind: plant.potted, at: { x: 460, y: 1560 }, facing: 139893 }
    - { key: plant.back, kind: plant.potted, at: { x: 520, y: 8010 }, facing: 111245 }
  solids:
    # the counter, its customer face 6.57 m in
    - { min: { x: 3860, y: 6570 }, max: { x: 8320, y: 7350 }, height: 1060 }
    # the back worktop
    - { min: { x: 3860, y: 9290 }, max: { x: 8320, y: 9910 }, height: 880 }
    # the window bench's seat slab
    - { min: { x: 2360, y: 460 }, max: { x: 8020, y: 900 }, height: 470 }
    # the west dresser
    - { min: { x: 0, y: 2110 }, max: { x: 340, y: 4510 }, height: 840 }
    # the three round tables. Each table's solid and its two chairs' share a `group` (`ARC-332`):
    # a chair tucked under its table overlaps the table's box by 14 to 63 mm, by design
    - { min: { x: 4443, y: 2743 }, max: { x: 5277, y: 3577 }, height: 716, furnishing: table.east, group: seating.east }
    - { min: { x: 6673, y: 4160 }, max: { x: 7547, y: 4997 }, height: 716, furnishing: table.north, group: seating.north }
    - { min: { x: 1866, y: 8166 }, max: { x: 2654, y: 8954 }, height: 716, furnishing: table.back, group: seating.back }
    # the open front door's leaf
    - { min: { x: 751, y: 0 }, max: { x: 1153, y: 746 }, height: 2070 }
    # the board across the back-room doorway
    - { min: { x: 195, y: 10230 }, max: { x: 1245, y: 10320 }, height: 2000 }
    # the seating at the three round tables: two chairs each, sized as `put_solid` sizes a collider
    # (the glTF bounds, yawed, x 0.92). A chair a person walks through is the clipping defect; every

# The park: the town's one open green, on the south side of the street.
#
# Millimetres from the park's own origin, its south-west corner; `x` east, `y` north
# (`docs/CORE_CONCEPTS.md` §6.1). The park is 20 m by 15 m, and its gate is on its north edge, facing
# the street. The 3D slice draws the house door it is entered by but not the park, so its edges and
# benches are this file's own, sized to its description (step-11 §19.3.1).

tags:
  - park
  - public
  - outdoor

note: >-
  A small park on the south side of the street: a lawn, a few benches, and a path round it.

# The gate: 0.4 m inside the park's north edge, and on the street's south side 0.4 m in front of the
# house door 15.3 m east of the café's.
passages:
  - to: street
    here:
      x: 1000
      y: 14600
    there:
      x: 15300
      y: -12600

# Owned by the `bodies` system (`ARC-39`): the park's edge, two benches and a fountain.
body:
  floor: { min: { x: 0, y: 0 }, max: { x: 20000, y: 15000 } }
  solids:
    - { min: { x: 3000, y: 12000 }, max: { x: 4900, y: 12700 }, height: 840 }
    - { min: { x: 12000, y: 5000 }, max: { x: 13900, y: 5700 }, height: 840 }
    # the fountain
    - { min: { x: 9000, y: 6000 }, max: { x: 11000, y: 8000 }, height: 600 }

# Owned by the `posture` system (`ARC-147`): three places on each 1.9 m bench, one person per 600 mm
# (Q-S34-8), on free floor 260 mm in front of the bench's box (S34-c SD-c-1). The park has no drawn
# bench yet, so each faces the lawn: the north-west bench south, the south-east bench north toward the
# fountain.
sit-points:
  - { key: park-bench-west.1, group: park-bench-west, at: { x: 3350, y: 11740 }, facing: 180000 }
  - { key: park-bench-west.2, group: park-bench-west, at: { x: 3950, y: 11740 }, facing: 180000 }
  - { key: park-bench-west.3, group: park-bench-west, at: { x: 4550, y: 11740 }, facing: 180000 }
  - { key: park-bench-east.1, group: park-bench-east, at: { x: 12350, y: 5960 }, facing: 0 }
  - { key: park-bench-east.2, group: park-bench-east, at: { x: 12950, y: 5960 }, facing: 0 }
  - { key: park-bench-east.3, group: park-bench-east, at: { x: 13550, y: 5960 }, facing: 0 }

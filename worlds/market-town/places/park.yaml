# (`docs/CORE_CONCEPTS.md` §6.1). The park is about 20 m by 15 m, and its gate is on its north edge,
# facing the street. Like every place but the café, it has no drawn geometry yet — the 3D slice
# depicts the café and the street — so these positions are semantic: where people are relative to
# each other and to the gate, which is all the world decides with.


# Market Town's weather (`weather` System Pack; `docs/DECISIONS.md` `ARC-61`, `ARC-68`).
#
# Content, not code: the town's climate, as twelve months of integer WGEN-lite parameters (January
# first), and the seed that draws its days. The seed is the world's, not `run --seed`'s: the same town
# has the same weather whoever drives its people. PROVISIONAL (step-19 TW-b): TW-d replaces this table
# with one fitted from San Diego's daily station record and switches `source` to that record.
#
# Derived from NOAA NCEI, U.S. Climate Normals 1991–2020, monthly, station USW00023188 (San Diego
# Lindbergh Field, CA), https://www.ncei.noaa.gov/data/normals-monthly/1991-2020/access/USW00023188.csv,
# read 2026-10-09. Inputs, January … December:
#   MLY-TMAX-NORMAL (°F)          66.4 66.2 67.0 68.8 69.5 71.7 75.3 77.3 77.2 74.6 70.7 66.0
#   MLY-TMIN-NORMAL (°F)          50.3 51.8 54.5 57.1 60.0 62.6 66.1 67.5 66.2 61.5 54.8 49.8
#   MLY-PRCP-AVGNDS-GE001HI (d)   6.5  7.1  6.2  3.8  2.2  0.7  0.7  0.3  0.9  2.4  3.7  5.8
#   MLY-PRCP-NORMAL (in)          1.98 2.20 1.46 0.65 0.28 0.05 0.08 0.01 0.12 0.50 0.79 1.67
#
# Every value below, and how it is obtained ("round" is to the nearest integer):
#   tmax_dc, tmin_dc        round((°F − 32) × 50 / 9), the normal in 0.1 °C.
#   p_wet_after_dry         round(π × (1000 − r)), with π = wet days (≥ 0.01 in) / days in the month
#                           (February 28) and an assumed lag-1 persistence r = 300 ‰ — PROVISIONAL r.
#   p_wet_after_wet         p_wet_after_dry + r. The chain's stationary wet fraction
#                           p_wd / (1000 − p_ww + p_wd) is then π itself.
#   rain_tenth_mm           μ × (0.105, 0.357, 0.693, 1.204, 2.303), rounded, each at least 3, where
#                           μ = MLY-PRCP-NORMAL × 254 / wet days is the mean wet-day amount in 0.1 mm and
#                           the factors are −ln(1 − p) at p = 0.1, 0.3, 0.5, 0.7, 0.9: the quintile
#                           midpoints of an exponential distribution with that mean — PROVISIONAL shape.
# PROVISIONAL design values (not from the normals; TW-d's fit replaces them):
#   t_noise_dc 30, t_ar_permille 600   day-to-day temperature anomaly: AR(1) persistence 0.6 (WGEN's
#                                      typical value) and uniform noise ±3.0 °C, a stationary spread of
#                                      about ±2.2 °C
#   wet_tmax_shift_dc −20              a rainy day's maximum is 2 °C cooler
#   fog_permille                       morning fog, most often in autumn and winter (about 21 days a year)
#   thunder_permille                   thunder on a wet day, likeliest in the late-summer monsoon
#   overcast_morning_permille          a grey morning on a dry day: the marine layer of "May Gray" and
#                                      "June Gloom"
#   wind_dms, wind_from_deg            mean wind 2.4 – 3.7 m/s from the west-north-west (the sea breeze)

[package]
name = "mineworld-acceptance"
description = "MineWorld's acceptance and conformance tests for its frozen criteria: tests that read the repository and its history rather than one crate's API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# SC-6 for the arrival-resolver seam (step-11 RS-11) is its own program, as persistence's
# kill_and_resume is: the same binary is the parent that kills and the child that is killed, selected
# by an environment variable, so it cannot use the test harness — a harness would also count the child
# entry point as a test that "passed" by doing nothing.
[[test]]
name = "arrival_resolvers_resume"
harness = false

# No dependencies of its own: the repository-reading tests read files and run `git`. The cross-crate
# checkpoints of S9 drive real crates together, so they need those crates as dev-dependencies — and
# here, rather than in any of them, a test-only System Pack can be defined that no library is ever
# compiled against (step-10 QS-24).
[dev-dependencies]
mineworld-contracts = { workspace = true }
mineworld-kernel = { workspace = true }
# The arrival-resolver seam (step-11 §16, ARC-39): its synthetic resolvers are driven through the real
# movement pack, and its SIGKILL-and-resume test writes a real save.
mineworld-movement = { workspace = true }
mineworld-persistence = { workspace = true }
mineworld-presence = { workspace = true }
mineworld-rule-controller = { workspace = true }
# AC-1 check 3 (ARC-35 item 4): both World Packs are read by the real loader, their YAML compared as
# structural values, and a section's owner answered by the build's own catalog (step-10 SD-32).
mineworld-worldpack = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
# Scratch repositories and saves, removed when each test ends (DEP-29).
mineworld-test-support = { workspace = true }
